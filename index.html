<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SFA Classes</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#fffafb}.header{background:#fff;padding:12px 14px;display:flex;align-items:center;box-shadow:0 1px 10px rgba(0,0,0,.06);position:sticky;top:0;z-index:50}.logo{cursor:pointer;display:flex;gap:10px;align-items:center}.menu{position:fixed;top:64px;left:12px;background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:10px;width:210px;z-index:100;border:1px solid #eee}.container{max-width:440px;margin:0 auto;padding:12px}.card{background:#fff;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 4px 20px rgba(0,0,0,.05);border:1px solid #f1f5f9}.btn{padding:12px;border-radius:12px;border:none;font-weight:700;width:100%;cursor:pointer}.btn-dark{background:#1e1b4b;color:#fff}.btn-green{background:#22c55e;color:#fff}.hidden{display:none!important}.banner{border-radius:18px;overflow:hidden;margin-bottom:12px}.banner img{width:100%;display:block}.input{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;margin-bottom:10px}textarea.input{height:80px}</style></head><body>
<div class="header"><div class="logo" onclick="toggleM()"><img src="file_000000006f048211a0068b5f7a862720.jpg" style="width:42px;height:42px;border-radius:12px"><div><b>SFA Classes</b><br><small style="color:#22c55e">Study for all</small></div></div></div>
<div id="mBox" class="menu hidden"><button class="btn btn-dark" onclick="openT()">👨‍🏫 Teacher Login</button><button class="btn btn-green" style="margin-top:8px" onclick="openS()">🎓 Student Login</button></div>

<div id="home" class="container">
<div class="banner"><img src="sfa_banner.jpg"></div>
<div class="card"><b>⭐ Students of the Week</b><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px"><div style="text-align:center"><img src="https://i.pravatar.cc/80?u=1" style="width:56px;height:56px;border-radius:50%"><div style="font-size:12px;font-weight:700">Aarav</div><small>10th</small></div><div style="text-align:center"><img src="https://i.pravatar.cc/80?u=2" style="width:56px;height:56px;border-radius:50%"><div style="font-size:12px;font-weight:700">Priya</div><small>9th</small></div><div style="text-align:center"><img src="https://i.pravatar.cc/80?u=3" style="width:56px;height:56px;border-radius:50%"><div style="font-size:12px;font-weight:700">Rohan</div><small>10th</small></div></div></div>
<div class="card"><b>💬 Student Review</b><div id="revBox"></div></div>
<div class="card" style="text-align:center"><p style="font-size:13px;color:#64748b">Upar SFA logo dabao login ke liye ☝️</p></div>
</div>

<div id="tLogin" class="container hidden"><div class="card"><h2>Teacher Login</h2><input id="tid" class="input" placeholder="ID: admin"><input id="tpass" class="input" type="password" placeholder="Pass: 1234"><button class="btn btn-dark" onclick="doTLogin()">Login</button><button class="btn" style="background:#f1f5f9;margin-top:10px" onclick="goHome()">← Back</button></div></div>

<div id="sLogin" class="container hidden"><div class="card"><h2>Student Login</h2><input class="input" placeholder="Roll"><button class="btn btn-green">Login</button><button class="btn" style="background:#f1f5f9;margin-top:10px" onclick="goHome()">← Back</button></div></div>

<div id="tDash" class="container hidden">
<div class="card"><b>Teacher Dashboard</b> <span onclick="goHome()" style="float:right;background:#f1f5f9;padding:6px 10px;border-radius:8px;font-size:12px">Logout</span></div>
<div class="card" style="border:2px dashed #22c55e"><b>➕ Student Review Add/Update</b><input id="rName" class="input" placeholder="Student Name" style="margin-top:10px"><input id="rClass" class="input" placeholder="Class"><textarea id="rText" class="input" placeholder="Review likho..."></textarea><input id="rPhoto" type="file" accept="image/*" class="input"><img id="rPrev" class="hidden" style="width:70px;height:70px;border-radius:50%;margin-bottom:8px"><button class="btn btn-green" onclick="saveR()">✅ Save Review</button></div>
<div class="card"><b>Preview</b><div id="tPrev"></div><button onclick="delR()" style="margin-top:10px;width:100%;padding:10px;border:none;background:#fee2e2;color:#dc2626;border-radius:10px">Delete Review</button></div>
</div>

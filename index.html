<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SFA Classes</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#fffafb}.header{background:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 10px rgba(0,0,0,.06);position:sticky;top:0;z-index:20}.logo-area{display:flex;gap:10px;align-items:center;cursor:pointer}.menu{position:absolute;top:62px;left:12px;background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.12);border:1px solid #f1f5f9;padding:8px;width:200px;z-index:30}.menu button{width:100%;padding:12px;border-radius:12px;border:none;font-weight:700;margin-bottom:8px;cursor:pointer;text-align:left}.container{max-width:440px;margin:0 auto;padding:12px}.card{background:#fff;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 4px 20px rgba(0,0,0,.05);border:1px solid #f1f5f9}.btn{padding:13px;border-radius:14px;border:none;font-weight:700;width:100%;cursor:pointer}.btn-dark{background:#1e1b4b;color:#fff}.btn-green{background:#22c55e;color:#fff}.hidden{display:none!important}.banner{width:100%;border-radius:18px;overflow:hidden;margin-bottom:12px;border:1px solid #f1f5f9}.banner img{width:100%;display:block}.input{width:100%;padding:13px;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;margin-bottom:10px}</style></head><body><div class="header"><div class="logo-area" onclick="toggleMenu()"><img src="file_000000006f048211a0068b5f7a862720.jpg" style="width:42px;height:42px;border-radius:12px;object-fit:cover;border:1px solid #eee"><div><b style="color:#1e1b4b">SFA Classes</b><br><small style="color:#22c55e;font-weight:700">Study for all</small></div></div></div><div id="mainMenu" class="menu hidden"><button class="btn-dark" onclick="showPage('teacherLogin');hideMenu()">👨‍🏫 Teacher Login</button><button class="btn-green" onclick="showPage('studentLogin');hideMenu()" style="margin-bottom:0">🎓 Student Login</button></div><div id="homePage" class="container"><div class="banner"><img src="sfa_banner.jpg"></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>⭐ Students of the Week</b><small style="color:#94a3b8">Top Performers</small></div><div id="sowGrid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px"></div></div><div class="card" style="text-align:center;padding:28px 16px"><img src="file_000000006f048211a0068b5f7a862720.jpg" style="width:86px;height:86px;border-radius:20px;margin-bottom:12px"><h3>Padhai Sabke Liye</h3><p style="color:#64748b;font-size:13px;margin-top:6px">Marks, Fees, Papers ek jagah</p><p style="color:#94a3b8;font-size:12px;margin-top:18px">Upar SFA logo pe click karo login ke liye ☝️</p></div></div><div id="studentLogin" class="container hidden"><div class="card"><h2>Student Login</h2><input id="sRoll" class="input" placeholder="Roll No"><input id="sPass" class="input" type="password" placeholder="Password"><button class="btn btn-green" onclick="doStudentLogin()">Login</button><p onclick="showPage('homePage')" style="text-align:center;margin-top:12px;color:#64748b">← Back</p></div></div><div id="teacherLogin" class="container hidden"><div class="card"><h2>Teacher Login</h2><input id="tId" class="input" placeholder="Teacher ID"><input id="tPass" class="input" type="password" placeholder="Password"><button class="btn btn-dark" onclick="doTeacherLogin()">Login</button><p onclick="showPage('homePage')" style="text-align:center;margin-top:12px;color:#64748b">← Back</p></div></div><div id="studentDash" class="container hidden"><div class="card"><b id="sdName"></b></div></div><div id="teacherDash" class="container hidden"><div class="card"><b>Teacher Dashboard</b><p style="color:#64748b;font-size:13px">Ab aap students add kar sakte ho!</p></div></div><script>let students=JSON.parse(localStorage.getItem('sfa_students')||'[]'),sow=[{name:"Aarav",class:"10th"},{name:"Priya",class:"9th"},{name:"Rohan",class:"10th"}];function showPage(id){['homePage','studentLogin','teacherLogin','studentDash','teacherDash'].forEach(p=>document.getElementById(p).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');hideMenu()}function toggleMenu(){document.getElementById('mainMenu').classList.toggle('hidden')}function hideMenu(){document.getElementById('mainMenu').classList.add('hidden')}function renderSOW(){document.getElementById('sowGrid').innerHTML=sow.map(s=>`<div style="text-align:center"><img src="https://i.pravatar.cc/80?u=${s.name}" style="width:56px;height:56px;border-radius:50%"><div style="font-size:12px;font-weight:700;margin-top:4px">${s.name}</div><small style="color:#64748b">${s.class}</small></div>`).join('')}function doStudentLogin(){let r=document.getElementById('sRoll').value.trim(),p=document.getElementById('sPass').value.trim();let st=students.find(s=>(s.roll===r)&&s.password===p);if(!st){alert('Galat details');return}document.getElementById('sdName').innerText=st.name||r;showPage('studentDash')}function doTeacherLogin(){if(document.getElementById('tId').value==='admin'&&document.getElementById('tPass').value==='1234'){showPage('teacherDash')}else alert('ID: admin / Pass: 1234')}document.addEventListener('click',function(e){if(!e.target.closest('.logo-area')&&!e.target.closest('#mainMenu'))hideMenu()});renderSOW();</script></body></html>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;overflow:hidden}
#logoBtn{position:fixed;top:10px;left:10px;z-index:9999;background:#fff;padding:6px 12px;border-radius:12px;border:none;display:flex;align-items:center;gap:6px;cursor:pointer}

#sWrap{
width:100vw;height:100vh;
display:flex;overflow-x:scroll;overflow-y:hidden;
scroll-snap-type:x mandatory;
-webkit-overflow-scrolling:touch;
scroll-behavior:smooth;
}
#sWrap::-webkit-scrollbar{display:none}

.page{
min-width:100vw;width:100vw;height:100vh;
scroll-snap-align:start;flex-shrink:0;
position:relative;background:#000;
overflow:hidden;
display:flex;align-items:center;justify-content:center;
}

/* SFA BANNER - pura dikhega, katega nahi */
#pg0{background:#fef9e8}
#pg0 img{
width:100%;height:100%;
object-fit:contain; /* banner ke liye contain */
object-position:center;
pointer-events:none; /* hilna band */
user-select:none;
-webkit-user-drag:none;
}

/* TOPPERS - face cut nahi hoga, stable rahega */
.page:not(#pg0) img{
width:100%;height:100%;
object-fit:cover;
object-position:top center; /* face upar se cut nahi hoga */
pointer-events:none;
user-select:none;
-webkit-user-drag:none;
transform:translateZ(0); /* hilna rokne ke liye */
will-change:transform;
}

.dots{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:999}
.dot{width:12px;height:12px;background:rgba(255,255,255,.6);border-radius:50%;border:2px solid #fff;cursor:pointer}
.dot.on{background:#1e1b4b;width:30px;border-radius:10px;border-color:#fff}
.reviewBar{position:fixed;bottom:60px;left:10px;right:10px;background:#fff;border-radius:12px;padding:8px 10px;display:flex;gap:8px;align-items:center;z-index:999}
.hide{display:none!important}
.btn{width:100%;padding:12px;border:none;border-radius:10px;color:#fff;font-weight:bold;cursor:pointer}
input{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin-bottom:6px}
</style>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;overflow:hidden}
#logoBtn{position:fixed;top:10px;left:10px;z-index:9999;background:#fff;padding:6px 12px;border-radius:12px;border:none;display:flex;align-items:center;gap:6px;cursor:pointer}
#sWrap{width:100vw;height:100vh;display:flex;overflow-x:scroll;scroll-snap-type:x mandatory}

.dots{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:999}
.dot{width:12px;height:12px;background:#aaa;border-radius:50%;border:2px solid #fff;cursor:pointer}
.dot.on{background:#1e1b4b;width:30px;border-radius:10px}
.reviewBar{position:fixed;bottom:60px;left:10px;right:10px;background:#fff;border-radius:12px;padding:8px 10px;display:flex;gap:8px;align-items:center;z-index:999}
.hide{display:none!important}
.btn{width:100%;padding:12px;border:none;border-radius:10px;color:#fff;font-weight:bold;cursor:pointer}
input{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin-bottom:6px}
</style>
</head>

<script>
function goTo(i){document.getElementById('sWrap').scrollTo({left:i*window.innerWidth,behavior:'smooth'});}
function checkDot(){let w=document.getElementById('sWrap');let idx=Math.round(w.scrollLeft/window.innerWidth);for(let j=0;j<4;j++){let d=document.getElementById('d'+j);if(d) d.className=j===idx?'dot on':'dot';}}
function showTab(t){document.getElementById('boxT').classList.toggle('hide',t!=='T');document.getElementById('boxS').classList.toggle('hide',t!=='S');document.getElementById('boxA').classList.toggle('hide',t!=='A');}
function teacherLogin(){
let a=document.getElementById('a').value, b=document.getElementById('b').value;
if(a==='admin' && b==='1234'){
document.getElementById('tlog').style.display='none';
document.getElementById('tdash').classList.remove('hide');
switchDash('stu');
loadData();
}else alert('ID: admin, Pass: 1234');
}
function switchDash(t){
document.getElementById('dashStu').classList.toggle('hide',t!=='stu');
document.getElementById('dashRev').classList.toggle('hide',t!=='rev');
document.getElementById('dashTop').classList.toggle('hide',t!=='top');
document.getElementById('dbStu').style.background=t==='stu'?'#1e1b4b':'#eee';
document.getElementById('dbStu').style.color=t==='stu'?'#fff':'#000';
document.getElementById('dbRev').style.background=t==='rev'?'#1e1b4b':'#eee';
document.getElementById('dbRev').style.color=t==='rev'?'#fff':'#000';
document.getElementById('dbTop').style.background=t==='top'?'#1e1b4b':'#eee';
document.getElementById('dbTop').style.color=t==='top'?'#fff':'#000';
}
let tmp={};

document.getElementById('r2n').value=reviews[1].n;document.getElementById('r2t').value=reviews[1].t;
document.getElementById('r3n').value=reviews[2].n;document.getElementById('r3t').value=reviews[2].t;
renderStudents();
}
function addStudent(){
let n=document.getElementById('sName').value, id=document.getElementById('sId').value, p=document.getElementById('sPass').value, c=document.getElementById('sCourse').value;

arr.push({name:n,id:id,pass:p,course:c});
localStorage.setItem('sfa_students',JSON.stringify(arr));
document.getElementById('sName').value='';document.getElementById('sId').value='';document.getElementById('sPass').value='';document.getElementById('sCourse').value='';
renderStudents();alert('Student Added!');
}

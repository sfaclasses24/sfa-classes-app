document.addEventListener('DOMContentLoaded',function(){

let tmp={},ri=0;
let wrap=document.getElementById('sWrap');
let dots=document.querySelectorAll('.dot');

function updateDots(){
let idx=Math.round(wrap.scrollLeft/window.innerWidth);
dots.forEach((d,j)=>d.classList.toggle('on',j===idx));
}
wrap.addEventListener('scroll',updateDots,{passive:true});
dots.forEach(d=>{
d.addEventListener('click',()=>{
let i=parseInt(d.dataset.i);
wrap.scrollTo({left:i*window.innerWidth,behavior:'smooth'});
});
});

let logoBtn=document.getElementById('logoBtn');
let tlog=document.getElementById('tlog');
function openLogin(){tlog.style.display='flex';}
function closeAll(){tlog.style.display='none';document.getElementById('td').classList.add('hide');}
logoBtn.addEventListener('click',openLogin);
document.getElementById('btnC').addEventListener('click',closeAll);
document.getElementById('xTD').addEventListener('click',closeAll);

function tab(t){
document.getElementById('tT').classList.toggle('on',t==='T');
document.getElementById('tS').classList.toggle('on',t==='S');
document.getElementById('tA').classList.toggle('on',t==='A');
document.getElementById('boxT').classList.toggle('hide',t!=='T');
document.getElementById('boxS').classList.toggle('hide',t!=='S');
document.getElementById('boxA').classList.toggle('hide',t!=='A');
}
document.getElementById('tT').onclick=()=>tab('T');
document.getElementById('tS').onclick=()=>tab('S');
document.getElementById('tA').onclick=()=>tab('A');

document.getElementById('btnT').onclick=()=>{
if(document.getElementById('a').value==='admin'&&document.getElementById('b').value==='1234'){
closeAll();document.getElementById('td').classList.remove('hide');switchTeacherTab('stu');
}else alert('admin / 1234');
};
document.getElementById('btnS').onclick=()=>{closeAll();alert('Welcome')};

window.switchTeacherTab=function(t){
document.getElementById('panelStudents').classList.toggle('hide',t!=='stu');
document.getElementById('panelReviews').classList.toggle('hide',t!=='rev');
document.getElementById('panelToppers').classList.toggle('hide',t!=='top');
document.getElementById('tTabStu').style.background=t==='stu'?'#1e1b4b':'#eee';
document.getElementById('tTabStu').style.color=t==='stu'?'#fff':'#000';
document.getElementById('tTabRev').style.background=t==='rev'?'#1e1b4b':'#eee';
document.getElementById('tTabRev').style.color=t==='rev'?'#fff':'#000';
document.getElementById('tTabTop').style.background=t==='top'?'#1e1b4b':'#eee';
document.getElementById('tTabTop').style.color=t==='top'?'#fff':'#000';
};
document.getElementById('tTabStu').onclick=()=>switchTeacherTab('stu');
document.getElementById('tTabRev').onclick=()=>switchTeacherTab('rev');

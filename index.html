<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SFA Classes</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f8fafc}.header{background:white;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 10px rgba(0,0,0,.06);position:sticky;top:0}.logo{display:flex;gap:10px;align-items:center}.logo img{width:50px;height:50px;border-radius:14px;object-fit:cover;border:1px solid #eee;background:#ffe4e6}.container{max-width:440px;margin:0 auto;padding:14px}.card{background:white;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 4px 20px rgba(0,0,0,.05)}.btn{padding:12px;border-radius:12px;border:none;font-weight:600;cursor:pointer;width:100%}.btn-dark{background:#1e1b4b;color:white}.btn-green{background:#22c55e;color:white}.input{width:100%;padding:13px;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;margin-bottom:10px}.hidden{display:none!important}.sow-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.sow{background:#f8fafc;border-radius:16px;padding:10px;text-align:center}.sow img{width:58px;height:58px;border-radius:50%;object-fit:cover}.tab-row{display:flex;gap:8px;overflow:auto}.tab{padding:9px 14px;border-radius:10px;border:1px solid #e2e8f0;background:white;font-size:12px;white-space:nowrap;cursor:pointer}.tab.active{background:#1e1b4b;color:white}</style></head><body><div class="header"><div class="logo"><img src="file_000000006f048211a0068b5f7a862720.jpg"><div><h1 style="font-size:17px;color:#1e1b4b">SFA Classes</h1><p style="font-size:11px;color:#22c55e;font-weight:700">Study for all</p></div></div><button id="logoutBtn" class="hidden" onclick="location.reload()" style="padding:8px 12px;border-radius:8px;border:1px solid #e2e8f0;background:white">Logout</button></div><div id="homePage" class="container"><div class="card"><b>🌟 Students of the Week</b><div class="sow-grid" id="sowGrid" style="margin-top:10px"></div></div><div class="card" style="text-align:center"><img src="file_000000006f048211a0068b5f7a862720.jpg" style="width:90px;height:90px;border-radius:20px;margin-bottom:8px;border:1px solid #eee;background:#ffe4e6;object-fit:cover"><h3>Padhai Sabke Liye</h3><p style="color:#64748b;font-size:13px">Marks, Fees, Papers ek jagah</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px"><button class="btn btn-dark" onclick="showPage('teacherLogin')">Teacher Login</button><button class="btn btn-green" onclick="showPage('studentLogin')">Student Login</button></div><div style="margin-top:12px;background:#f8fafc;padding:10px;border-radius:12px;font-size:12px">Teacher: <b>admin</b> / <b>1234</b></div></div></div><div id="studentLogin" class="container hidden"><div class="card"><h2>Student Login</h2><br><input id="sRoll" class="input" placeholder="Roll No / Mobile"><input id="sPass" class="input" type="password" placeholder="Password"><button class="btn btn-green" onclick="doStudentLogin()">Login</button><p onclick="showPage('homePage')" style="text-align:center;margin-top:10px;color:#64748b">← Back</p></div></div><div id="teacherLogin" class="container hidden"><div class="card"><h2>Teacher Login</h2><br><input id="tId" class="input" placeholder="admin"><input id="tPass" class="input" type="password" placeholder="1234"><button class="btn btn-dark" onclick="doTeacherLogin()">Login</button><p onclick="showPage('homePage')" style="text-align:center;margin-top:10px;color:#64748b">← Back</p></div></div><div id="studentDash" class="container hidden"><div class="card"><b id="sdName"></b><br><small id="sdMeta" style="color:#64748b"></small><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px"><div style="background:#f8fafc;padding:12px;border-radius:12px"><small>Total</small><br><b id="sdTotal">₹0</b></div><div style="background:#f0fdf4;padding:12px;border-radius:12px"><small>Paid</small><br><b id="sdPaid">₹0</b></div></div><div style="margin-top:10px;background:#fef2f2;padding:10px;border-radius:12px;display:flex;justify-content:space-between"><small>Pending</small><b id="sdPending">₹0</b></div></div><div class="card"><b>My Marks</b><div id="sdMarks" style="margin-top:10px"></div></div></div><div id="teacherDash" class="container hidden"><div class="card"><div class="tab-row"><div class="tab active" onclick="switchTab('add',this)">+ Add</div><div class="tab" onclick="switchTab('list',this)">List</div><div class="tab" onclick="switchTab('marks',this)">Marks</div><div class="tab" onclick="switchTab('sow',this)">Top 3</div></div></div><div id="tab-add" class="card"><h3>Add Student</h3><br><input type="file" id="nPhoto" class="input" accept="image/*"><input id="nName" class="input" placeholder="Name *"><input id="nRoll" class="input" placeholder="Roll No *"><input id="nClass" class="input" placeholder="Class"><input id="nMobile" class="input" placeholder="Mobile"><input id="nPass" class="input" placeholder="Password"><input id="nFeesT" type="number" class="input" placeholder="Total Fees"><input id="nFeesP" type="number" class="input" placeholder="Paid"><button class="btn btn-dark" onclick="addStudent()">Add Student</button></div><div id="tab-list" class="card hidden"><h3>Students (<span id="stuCount">0</span>)</h3><input id="searchStu" class="input" placeholder="Search" oninput="renderList()"><div id="stuList"></div></div><div id="tab-marks" class="card hidden"><h3>Marks Entry</h3><select id="mStu" class="input"></select><input id="mSub" class="input" placeholder="Subject"><input id="mMarks" type="number" class="input" placeholder="Obtained"><input id="mTotal" type="number" class="input" placeholder="Total"><button class="btn btn-green" onclick="addMarks()">Save Marks</button><div id="allMarks" style="margin-top:10px"></div></div><div id="tab-sow" class="card hidden"><h3>Top 3 Edit</h3><div id="sowForm"></div><button class="btn btn-dark" style="margin-top:10px" onclick="saveSOW()">Save Top 3</button></div></div><script>let students=JSON.parse(localStorage.getItem('sfa_students')||'[]'),marks=JSON.parse(localStorage.getItem('sfa_marks')||'[]'),sow=JSON.parse(localStorage.getItem('sfa_sow')||'[{"name":"Aarav","class":"10th","photo":"","badge":"Top Scorer"},{"name":"Priya","class":"9th","photo":"","badge":"Best HW"},{"name":"Rohan","class":"10th","photo":"","badge":"Improved"}]');function saveAll(){localStorage.setItem('sfa_students',JSON.stringify(students));localStorage.setItem('sfa_marks',JSON.stringify(marks));localStorage.setItem('sfa_sow',JSON.stringify(sow));renderSOW();}function showPage(id){['homePage','studentLogin','teacherLogin','studentDash','teacherDash'].forEach(p=>document.getElementById(p).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.getElementById('logoutBtn').classList.toggle('hidden',id==='homePage');renderSOW();}function switchTab(t,el){['add','list','marks','sow'].forEach(x=>document.getElementById('tab-'+x).classList.add('hidden'));document.getElementById('tab-'+t).classList.remove('hidden');document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));if(el)el.classList.add('active');if(t==='list')renderList();if(t==='marks'){renderMarksSelect();renderAllMarks();}if(t==='sow')renderSOWForm();}function renderSOW(){document.getElementById('sowGrid').innerHTML=sow.map(s=>`<div class="sow"><img src="${s.photo||'https://i.pravatar.cc/100?u='+s.name}"><b style="font-size:12px">${s.name}</b><br><small>${s.class}</small></div>`).join('');}function doStudentLogin(){let r=document.getElementById('sRoll').value.trim(),p=document.getElementById('sPass').value.trim();let st=students.find(s=>(s.roll===r||s.mobile===r)&&s.password===p);if(!st){alert('Galat Roll/Password');return}document.getElementById('sdName').innerText=st.name;document.getElementById('sdMeta').innerText=st.roll+' | '+st.class;document.getElementById('sdTotal').innerText='₹'+(st.feesTotal||0);document.getElementById('sdPaid').innerText='₹'+(st.feesPaid||0);document.getElementById('sdPending').innerText='₹'+((st.feesTotal||0)-(st.feesPaid||0));let m=marks.filter(x=>x.studentId===st.id);document.getElementById('sdMarks').innerHTML=m.length?m.map(x=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:13px"><span>${x.subject}</span><b>${x.marks}/${x.total}</b></div>`).join(''):'No marks';showPage('studentDash');}function doTeacherLogin(){if(document.getElementById('tId').value==='admin'&&document.getElementById('tPass').value==='1234'){showPage('teacherDash');renderList();}else alert('admin / 1234');}function addStudent(){let name=document.getElementById('nName').value.trim(),roll=document.getElementById('nRoll').value.trim();if(!name||!roll){alert('Name aur Roll bharo');return}let file=document.getElementById('nPhoto').files[0];let go=(ph)=>{students.push({id:Date.now().toString(),name,roll,class:document.getElementById('nClass').value,mobile:document.getElementById('nMobile').value,password:document.getElementById('nPass').value||'1234',feesTotal:+document.getElementById('nFeesT').value||0,feesPaid:+document.getElementById('nFeesP').value||0,photo:ph||''});saveAll();alert('Added: '+roll);renderList();};if(file){let r=new FileReader();r.onload=e=>go(e.target.result);r.readAsDataURL(file);}else go('');}function renderList(){let q=(document.getElementById('searchStu')?.value||'').toLowerCase();let list=students.filter(s=>s.name.toLowerCase().includes(q)||s.roll.toLowerCase().includes(q));document.getElementById('stuCount').innerText=list.length;document.getElementById('stuList').innerHTML=list.map(s=>`<div style="display:flex;gap:10px;align-items:center;padding:12px;border:1px solid #f1f5f9;border-radius:14px;margin-bottom:8px"><img src="${s.photo||'https://i.pravatar.cc/80?u='+s.roll}" style="width:40px;height:40px;border-radius:10px;object-fit:cover"><div style="flex:1"><b style="font-size:13px">${s.name}</b><br><small style="color:#64748b">${s.roll} | ${s.class} | Pass:${s.password}</small></div><button onclick="students=students.filter(x=>x.id!=='${s.id}');saveAll();renderList();" style="background:#fef2f2;color:red;border:none;padding:6px 10px;border-radius:8px">Del</button></div>`).join('');}function renderMarksSelect(){document.getElementById('mStu').innerHTML=students.map(s=>`<option value="${s.id}">${s.name} - ${s.roll}</option>`).join('');}function addMarks(){let sid=document.getElementById('mStu').value;if(!sid)return;marks.push({id:Date.now().toString(),studentId:sid,subject:document.getElementById('mSub').value||'Test',marks:+document.getElementById('mMarks').value||0,total:+document.getElementById('mTotal').value||100,date:new Date().toISOString()});saveAll();alert('Marks Saved');renderAllMarks();}function renderAllMarks(){document.getElementById('allMarks').innerHTML=marks.slice().reverse().slice(0,20).map(m=>{let st=students.find(s=>s.id===m.studentId);return `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee;font-size:13px"><span>${st?st.name:'Unknown'} - ${m.subject}</span><b>${m.marks}/${m.total}</b></div>`}).join('');}function renderSOWForm(){document.getElementById('sowForm').innerHTML=sow.map((s,i)=>`<div style="border:1px solid #f1f5f9;padding:10px;border-radius:12px;margin-bottom:8px"><b>Student ${i+1}</b><input id="sow_name_${i}" value="${s.name}" class="input" style="margin-top:6px" placeholder="Name"><input id="sow_class_${i}" value="${s.class}" class="input" placeholder="Class"><input id="sow_badge_${i}" value="${s.badge}" class="input" placeholder="Badge"><input type="file" id="sow_photo_${i}" class="input" accept="image/*"></div>`).join('');}function saveSOW(){let ns=[{},{},{}];let pending=3;for(let i=0;i<3;i++){let n=document.getElementById('sow_name_'+i).value,c=document.getElementById('sow_class_'+i).value,b=document.getElementById('sow_badge_'+i).value,f=document.getElementById('sow_photo_'+i).files[0];if(f){let r=new FileReader();r.onload=((idx,nn,cc,bb)=>e=>{ns[idx]={name:nn,class:cc,badge:bb,photo:e.target.result};pending--;if(pending===0){sow=ns;saveAll();alert('Top 3 Updated!');}})(i,n,c,b);r.readAsDataURL(f);}else{ns[i]={name:n,class:c,badge:b,photo:sow[i].photo};pending--;if(pending===0){sow=ns;saveAll();alert('Top 3 Updated!');}}}}
renderSOW();</script></body></html>

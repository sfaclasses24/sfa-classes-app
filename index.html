<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SFA Classes</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{margin:0;background:#fffbeb;overflow:hidden}
#logoBtn{position:fixed;top:10px;left:10px;z-index:9999;background:#fff;padding:6px 12px;border-radius:12px;display:flex;gap:6px;align-items:center;border:none;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#sWrap{width:100vw;height:100vh;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;background:#fffbeb}
#sWrap::-webkit-scrollbar{display:none}
.page{min-width:100vw;width:100vw;height:100vh;scroll-snap-align:start;flex-shrink:0;background:#fffbeb;line-height:0}
#pg0 img{width:100vw;height:100vh;object-fit:fill;display:block}
.pgOther img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.dots{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:999}
.dot{width:10px;height:10px;background:#bbb;border-radius:50%;border:2px solid #fff;cursor:pointer}
.dot.active{background:#1e1b4b;width:28px;border-radius:10px}
.reviewBar{position:fixed;bottom:58px;left:10px;right:10px;background:#fff;border-radius:14px;padding:9px 12px;display:flex;gap:10px;align-items:center;z-index:999;box-shadow:0 4px 15px rgba(0,0,0,.2)}
.hide{display:none!important}
.btn{width:100%;padding:13px;border:none;border-radius:10px;color:#fff;font-weight:bold;cursor:pointer}
input,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin-bottom:7px;background:#f8fafc}
.tab{display:flex;gap:6px;margin-bottom:12px}
.tabBtn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;background:#f1f5f9;cursor:pointer}
.tabBtn.on{background:#1e1b4b;color:#fff}
.card{background:#fff;border-radius:14px;padding:12px;margin-bottom:8px;border:1px solid #f1f5f9}
</style>
</head>
<body>
<button id="logoBtn"><img src="file_000000006f048211a0068b5f7a862720.jpg" style="width:30px;height:30px;border-radius:6px"><b style="font-size:12px;color:#1e1b4b">SFA Classes</b></button>

<div id="sWrap">
<div class="page" id="pg0"><img id="bannerImg" src="sfa_banner.jpg"></div>
<div class="page pgOther"><img src="https://i.pravatar.cc/800?img=11"></div>
<div class="page pgOther"><img src="https://i.pravatar.cc/800?img=5"></div>
<div class="page pgOther"><img src="https://i.pravatar.cc/800?img=8"></div>
</div>

<div class="reviewBar"><img id="rvImg" src="https://i.pravatar.cc/80?img=32" style="width:38px;height:38px;border-radius:50%"><div style="flex:1"><b id="rvName" style="font-size:12px">Rahul</b><br><small id="rvText" style="font-size:11px">Best!</small></div><small id="rvCount">1/3</small></div>
<div class="dots"><div class="dot active" id="d0"></div><div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div></div>

<div id="tlog" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99999;align-items:center;justify-content:center;padding:12px">
<div style="background:#fff;border-radius:18px;padding:14px;width:100%;max-width:370px;max-height:90vh;overflow:auto">
<div class="tab"><button class="tabBtn on" id="btnT">Teacher</button><button class="tabBtn" id="btnS">Student</button><button class="tabBtn" id="btnA">About</button></div>
<div id="boxT"><input id="a" placeholder="admin"><input id="b" type="password" placeholder="1234"><button class="btn" style="background:#1e1b4b" id="tLoginBtn">Teacher Login</button></div>
<div id="boxS" class="hide"><input id="sa" placeholder="Student ID"><input id="sb" type="password" placeholder="Password"><button class="btn" style="background:#16a34a" id="sLoginBtn">Student Login</button></div>
<div id="boxA" class="hide"><div style="background:#fffaf0;border-radius:14px;padding:14px;border:1px solid #fde68a"><b>Nitish Sir - 12+ Years</b><p style="font-size:12px;margin-top:8px">SFA Classes - Study for all<br>Small Steps Make Big Results</p><a href="tel:9910964524" style="display:block;background:#1e1b4b;color:#fff;text-align:center;padding:12px;border-radius:10px;text-decoration:none;margin-top:10px">📞 9910964524</a><a href="https://www.google.com/maps/search/?api=1&query=SFA+Classes" target="_blank" style="display:block;background:#fff;border:1px solid #ddd;text-align:center;padding:12px;border-radius:10px;text-decoration:none;margin-top:6px">📍 Maps</a></div></div>
<button class="btn" style="background:#eee;color:#000;margin-top:10px" id="closeLog">Close</button>
</div>
</div>

<div id="td" class="hide" style="position:fixed;inset:0;background:#f8fafc;z-index:100000;max-width:430px;margin:auto;overflow:auto">
<div style="background:#1e1b4b;color:#fff;padding:12px;display:flex;justify-content:space-between"><b>Teacher</b><button id="closeTd" style="background:#fff;color:#1e1b4b;border:none;padding:6px 12px;border-radius:8px">X</button></div>
<div style="padding:12px"><div class="card"><b>Add Student (Class)</b><br><br><input type="file" id="stuPhotoInput" accept="image/*"><input id="stuName" placeholder="Name"><input id="stuId" placeholder="ID"><input id="stuPass" type="password" placeholder="Password"><input id="stuClass" placeholder="Class e.g 10th"><input id="stuMarks" placeholder="Marks e.g 18/20"><select id="stuFees"><option value="Paid">Paid</option><option value="Unpaid">Unpaid</option><option value="Partial">Partial</option></select><button class="btn" style="background:#16a34a" id="addStuBtn">Add Student</button><div id="stuList" style="margin-top:12px"></div></div></div>
</div>

<div id="editModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100001;align-items:center;justify-content:center;padding:12px">
<div style="background:#fff;border-radius:16px;padding:14px;width:100%;max-width:400px;max-height:90vh;overflow:auto">
<b id="editName"></b><br><br><input id="editClass" placeholder="Class"><input id="editPass" placeholder="Password">
<div style="background:#fef3c7;border-radius:10px;padding:10px;margin:8px 0"><b>Weekly Marks</b><br><br><input id="weekLabel" placeholder="Week 1"><input id="weekMarks" placeholder="18/20"><button class="btn" style="background:#d97706" id="addWeekBtn">Add Week</button><div id="weekList"></div></div>
<div style="background:#dcfce7;border-radius:10px;padding:10px;margin:8px 0"><b>Monthly Fees</b><br><br><input id="monthLabel" placeholder="Jan 2026"><select id="monthStatus"><option value="Paid">Paid</option><option value="Unpaid">Unpaid</option><option value="Partial">Partial</option></select><button class="btn" style="background:#16a34a" id="addMonthBtn">Add Month</button><div id="monthList"></div></div>
<button class="btn" style="background:#1e1b4b" id="saveEditBtn">Save</button><button class="btn" style="background:#eee;color:#000;margin-top:6px" id="closeEdit">Close</button>
</div>
</div>

<div id="sdash" class="hide" style="position:fixed;inset:0;background:#f0fdf4;z-index:100002;max-width:430px;margin:auto;overflow:auto">
<div style="background:#16a34a;color:#fff;padding:14px;display:flex;justify-content:space-between"><b>Student</b><button id="closeSdash" style="background:#fff;color:#16a34a;border:none;padding:6px 12px;border-radius:8px">X</button></div>
<div style="padding:14px"><div class="card" style="text-align:center"><img id="sdPhoto" style="width:80px;height:80px;border-radius:50%"><br><br><b id="sdName"></b><br><small id="sdId"></small><br><small>Class: <b id="sdClass"></b></small></div><div class="card"><b>Weekly Marks</b><div id="sdMarksList"></div></div><div class="card"><b>Monthly Fees</b><div id="sdFeesList"></div></div></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function(){
const sWrap=document.getElementById('sWrap');
const dots=[document.getElementById('d0'),document.getElementById('d1'),document.getElementById('d2'),document.getElementById('d3')];
let ri=0;
let reviews=[{n:'Rahul Kumar',t:'Best coaching! SFA ne life badal di ❤️',p:'https://i.pravatar.cc/80?img=32'},{n:'Priya Singh',t:'95% aaya! Thanks Nitish Sir',p:'https://i.pravatar.cc/80?img=5'},{n:'Aman Verma',t:'Small batches, personal attention!',p:'https://i.pravatar.cc/80?img=8'}];
let tmpStuPhoto='';let editIndex=-1;

function goTo(i){ sWrap.scrollTo({left: i * sWrap.clientWidth, behavior:'smooth'}); }
function updateDots(){
let idx=Math.round(sWrap.scrollLeft / sWrap.clientWidth);
dots.forEach((d,j)=>{ if(d) d.className = j===idx? 'dot active' : 'dot'; });
}
function showTab(t){
document.getElementById('btnT').className = t==='T'? 'tabBtn on' : 'tabBtn';
document.getElementById('btnS').className = t==='S'? 'tabBtn on' : 'tabBtn';
document.getElementById('btnA').className = t==='A'? 'tabBtn on' : 'tabBtn';
document.getElementById('boxT').classList.toggle('hide', t!=='T');
document.getElementById('boxS').classList.toggle('hide', t!=='S');
document.getElementById('boxA').classList.toggle('hide', t!=='A');
}
function showReview(){
let r=reviews[ri];
document.getElementById('rvImg').src=r.p;
document.getElementById('rvName').innerText=r.n;
document.getElementById('rvText').innerText=r.t;
document.getElementById('rvCount').innerText=(ri+1)+'/3';
}

// EVENTS - DOT FIX
sWrap.addEventListener('scroll', updateDots);
dots[0].addEventListener('click', ()=>goTo(0));
dots[1].addEventListener('click', ()=>goTo(1));
dots[2].addEventListener('click', ()=>goTo(2));
dots[3].addEventListener('click', ()=>goTo(3));

// LOGIN MODAL
document.getElementById('logoBtn').addEventListener('click', ()=>{document.getElementById('tlog').style.display='flex'; showTab('T');});
document.getElementById('closeLog').addEventListener('click', ()=>{document.getElementById('tlog').style.display='none';});
document.getElementById('btnT').addEventListener('click', ()=>showTab('T'));
document.getElementById('btnS').addEventListener('click', ()=>showTab('S'));
document.getElementById('btnA').addEventListener('click', ()=>showTab('A'));
document.getElementById('closeTd').addEventListener('click', ()=>document.getElementById('td').classList.add('hide'));
document.getElementById('closeSdash').addEventListener('click', ()=>document.getElementById('sdash').classList.add('hide'));
document.getElementById('closeEdit').addEventListener('click', ()=>document.getElementById('editModal').style.display='none');

// LOGIN FIX
document.getElementById('tLoginBtn').addEventListener('click', ()=>{
let id=document.getElementById('a').value.trim();
let pass=document.getElementById('b').value.trim();
if(id==='admin' && pass==='1234'){
document.getElementById('tlog').style.display='none';
document.getElementById('td').classList.remove('hide');
loadAll();
}else alert('ID: admin Pass: 1234');
});

document.getElementById('sLoginBtn').addEventListener('click', ()=>{
let id=document.getElementById('sa').value.trim();
let pass=document.getElementById('sb').value.trim();
if(!id||!pass) return alert('ID Pass bharo');
let arr=JSON.parse(localStorage.getItem('sfa_students')||'[]');
let f=arr.find(s=>s.id===id && s.pass===pass);
if(!f) return alert('Student nahi mila');
document.getElementById('tlog').style.display='none';
document.getElementById('sdPhoto').src=f.photo||'https://i.pravatar.cc/80';
document.getElementById('sdName').innerText=f.name;
document.getElementById('sdId').innerText=f.id;
document.getElementById('sdClass').innerText=f.class||'-';
let mh='';(f.marksHistory||[]).forEach(m=>{mh+=`<div style="display:flex;justify-content:space-between;background:#fffbeb;padding:8px;border-radius:8px;margin-bottom:4px;font-size:12px"><span>${m.week}</span><b>${m.marks}</b></div>`});
document.getElementById('sdMarksList').innerHTML=mh||'No marks';
let fh='';(f.feesHistory||[]).forEach(m=>{fh+=`<div style="display:flex;justify-content:space-between;background:#f0fdf4;padding:8px;border-radius:8px;margin-bottom:4px;font-size:12px"><span>${m.month}</span><b>${m.status}</b></div>`});
document.getElementById('sdFeesList').innerHTML=fh||'No fees';
document.getElementById('sdash').classList.remove('hide');
});

// STUDENT ADD / EDIT
document.getElementById('stuPhotoInput').addEventListener('change', e=>{let r=new FileReader();r.onload=ev=>tmpStuPhoto=ev.target.result;r.readAsDataURL(e.target.files[0]);});
function loadAll(){
let arr=JSON.parse(localStorage.getItem('sfa_students')||'[]');let h='';
arr.forEach((s,i)=>{
let lastM=s.marksHistory&&s.marksHistory.length?s.marksHistory[s.marksHistory.length-1].marks:s.marks||'-';
let lastF=s.feesHistory&&s.feesHistory.length?s.feesHistory[s.feesHistory.length-1].status:s.fees||'-';
h+=`<div class="card" style="display:flex;gap:10px;align-items:center"><img src="${s.photo}" style="width:50px;height:50px;border-radius:50%;object-fit:cover"><div style="flex:1"><b style="font-size:12px">${s.name}</b><br><small>ID:${s.id} | Class:${s.class} | ${lastM} | ${lastF}</small></div><div><button class="editBtn" data-i="${i}" style="background:#e0e7ff;color:#1e1b4b;border:none;padding:6px 10px;border-radius:8px;font-size:11px">Edit</button> <button class="delBtn" data-i="${i}" style="background:#fee;color:#b00;border:none;padding:6px 8px;border-radius:8px">X</button></div></div>`;
});
document.getElementById('stuList').innerHTML=h||'No students';
document.querySelectorAll('.editBtn').forEach(b=>b.addEventListener('click', e=>{openEdit(parseInt(e.target.dataset.i));}));
document.querySelectorAll('.delBtn').forEach(b=>b.addEventListener('click', e=>{let idx=parseInt(e.target.dataset.i);let arr=JSON.parse(localStorage.getItem('sfa_students')||'[]');arr.splice(idx,1);localStorage.setItem('sfa_students',JSON.stringify(arr));loadAll();}));
}
document.getElementById('addStuBtn').addEventListener('click', ()=>{
let name=document.getElementById('stuName').value.trim();
let id=document.getElementById('stuId').value.trim();
let pass=document.getElementById('stuPass').value.trim();
let cls=document.getElementById('stuClass').value.trim();
let marks=document.getElementById('stuMarks').value.trim();
let fees=document.getElementById('stuFees').value;
if(!name||!id||!pass) return alert('Name ID Pass bharo');
let arr=JSON.parse(localStorage.getItem('sfa_students')||'[]');
arr.push({name,id,pass,class:cls,marks,fees,photo:tmpStuPhoto||'https://i.pravatar.cc/80',marksHistory:marks?[{week:'Initial',marks}]:[],feesHistory:[{month:'Start',status:fees}]});
localStorage.setItem('sfa_students',JSON.stringify(arr));
document.getElementById('stuName').value='';document.getElementById('stuId').value='';document.getElementById('stuPass').value='';document.getElementById('stuClass').value='';document.getElementById('stuMarks').value='';tmpStuPhoto='';document.getElementById('stuPhotoInput').value='';
loadAll();
});
function openEdit(i){editIndex=i;let arr=JSON.parse(localStorage.getItem('sfa_students')||'[]');let s=arr[i];document.getElementById('editName').innerText=s.name;document.getElementById('editClass').value=s.class||'';document.getElementById('editPass').value=s.pass||'';renderEdit();document.getElementById('editModal').style.display='flex';}
function renderEdit(){let arr=JSON.parse(localStorage.getItem('sfa_students')||'[]');if(editIndex<0) return;let s=arr[editIndex];let mh='';(s.marksHistory||[]).forEach((m,j)=>{mh+=`<div style="display:flex;justify-content:space-between;background:#fff;padding:6px;border-radius:6px;margin-bottom:4px;font-size:11px"><span>${m.week}: ${m.marks}</span><button class="delW" data-j="${j}" style="background:#fee;color:#b00;border:none;padding:2px 6px;border-radius:4px">X</button></div>`});document.getElementById('weekList').innerHTML=mh;let fh='';(s.feesHistory||[]).forEach((m,j)=>{fh+=`<div style="display:flex;justify-content:space-between;background:#fff;padding:6px;border-radius:6px;margin-bottom:4px;font-size:11px"><span>${m.month}: ${m.status}</span><button class="delM" data-j="${j}" style="background:#fee;color:#b00;border:none;padding:2px 6px;border-radius:4px">X</button></div>`});document.getElementById('monthList').innerHTML=fh;
document.querySelectorAll('.delW').forEach(b=>b.addEventListener('click', e=>{let j=parseInt(e.target.dataset.j);let arr=JSON.parse(localStorage.getItem('sfa_students')||'[]');arr[editIndex].marksHistory.splice(j,1);localStorage.setItem('sfa_students',JSON.stringify(arr));renderEdit();loadAll();}));
document.querySelectorAll('.delM').forEach(b=>b.addEventListener('click', e=>{let j=parseInt(e.target.dataset.j);let arr=JSON.parse(localStorage.getItem('sfa_students')||'[]');arr[editIndex].feesHistory.splice(j,1);localStorage.setItem('sfa_students',JSON.stringify(arr));renderEdit();loadAll();}));
}
document.getElementById('addWeekBtn').addEventListener('click', ()=>{let wl=document.getElementById('weekLabel').value;let wm=document.getElementById('weekMarks').value;if(!wl||!wm) return alert('Bharo');let arr=JSON.parse(localStorage.getItem('sfa_students')||'[]');arr[editIndex].marksHistory.push({week:wl,marks:wm});localStorage.setItem('sfa_students',JSON.stringify(arr));document.getElementById('weekLabel').value='';document.getElementById('weekMarks').value='';renderEdit();loadAll();});
document.getElementById('addMonthBtn').addEventListener('click', ()=>{let ml=document.getElementById('monthLabel').value;let ms=document.getElementById('monthStatus').value;if(!ml) return alert('Month bharo');let arr=JSON.parse(localStorage.getItem('sfa_students')||'[]');arr[editIndex].feesHistory.push({month:ml,status:ms});localStorage.setItem('sfa_students',JSON.stringify(arr));document.getElementById('monthLabel').value='';renderEdit();loadAll();});
document.getElementById('saveEditBtn').addEventListener('click', ()=>{let arr=JSON.parse(localStorage.getItem('sfa_students')||'[]');arr[editIndex].class=document.getElementById('editClass').value;arr[editIndex].pass=document.getElementById('editPass').value;localStorage.setItem('sfa_students',JSON.stringify(arr));loadAll();document.getElementById('editModal').style.display='none';});

// REVIEWS AUTO 5 SECONDS FIX
showReview();
setInterval(()=>{ri=(ri+1)%3; showReview();},5000); // 5 sec

loadAll();
});
</script>
</body>
  </html>

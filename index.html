<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SFA Classes</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;overflow:hidden}
#logoBtn{position:fixed;top:10px;left:10px;z-index:9999;background:#fff;padding:6px 12px;border-radius:12px;border:none;display:flex;align-items:center;gap:6px;cursor:pointer}
#sWrap{width:100vw;height:100vh;display:flex;overflow-x:scroll;scroll-snap-type:x mandatory}
.page{min-width:100vw;height:100vh;scroll-snap-align:start;position:relative;background:#fef9e8;flex-shrink:0}
.page img{width:100%;height:100%;object-fit:cover}
.dots{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:999}
.dot{width:12px;height:12px;background:#aaa;border-radius:50%;border:2px solid #fff}
.dot.on{background:#1e1b4b;width:30px;border-radius:10px}
.reviewBar{position:fixed;bottom:60px;left:10px;right:10px;background:#fff;border-radius:12px;padding:8px 10px;display:flex;gap:8px;align-items:center;z-index:999}
.hide{display:none!important}
.btn{width:100%;padding:12px;border:none;border-radius:10px;color:#fff;font-weight:bold}
input{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin-bottom:6px}
</style>
</head>
<body>

<!-- LOGO - direct onclick -->
<button id="logoBtn" onclick="document.getElementById('tlog').style.display='flex'">
<img src="file_000000006f048211a0068b5f7a862720.jpg" style="width:30px;height:30px;border-radius:6px" onerror="this.src='https://via.placeholder.com/30'">
<b style="font-size:12px;color:#1e1b4b">SFA Classes</b>
</button>

<div id="sWrap" onscroll="checkDot()">
<div class="page"><img src="https://i.pravatar.cc/800?img=11" id="img1"></div>
<div class="page"><img src="https://i.pravatar.cc/800?img=5" id="img2"></div>
<div class="page"><img src="https://i.pravatar.cc/800?img=8" id="img3"></div>
<div class="page"><img src="https://i.pravatar.cc/800?img=12"></div>
</div>

<div class="reviewBar"><img id="rvImg" src="https://i.pravatar.cc/40?img=32" style="width:36px;height:36px;border-radius:50%"><div><b id="rvName" style="font-size:12px">Rahul</b><p id="rvText" style="font-size:11px">Best coaching!</p></div></div>

<div class="dots">
<div class="dot on" id="d0" onclick="goTo(0)"></div>
<div class="dot" id="d1" onclick="goTo(1)"></div>
<div class="dot" id="d2" onclick="goTo(2)"></div>
<div class="dot" id="d3" onclick="goTo(3)"></div>
</div>

<!-- LOGIN -->
<div id="tlog" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99999;align-items:center;justify-content:center;padding:12px">
<div style="background:#fff;border-radius:16px;padding:14px;width:100%;max-width:360px">
<div style="display:flex;gap:6px;margin-bottom:10px">
<button onclick="showTab('T')" id="tT" style="flex:1;padding:10px;background:#1e1b4b;color:#fff;border:none;border-radius:8px;font-weight:700">Teacher</button>
<button onclick="showTab('S')" id="tS" style="flex:1;padding:10px;background:#eee;border:none;border-radius:8px">Student</button>
<button onclick="showTab('A')" id="tA" style="flex:1;padding:10px;background:#eee;border:none;border-radius:8px">About</button>
</div>
<div id="boxT"><input id="a" placeholder="admin"><input id="b" type="password" placeholder="1234"><button class="btn" style="background:#1e1b4b" onclick="teacherLogin()">Login</button></div>
<div id="boxS" class="hide"><input placeholder="student ID"><button class="btn" style="background:#16a34a" onclick="alert('Student login ok')">Login</button></div>
<div id="boxA" class="hide">
<b>Nitish Sir - Educator • 12+ Years</b><br><br>
<p style="font-size:12px">SFA Classes - Study for all<br>Mobile: 9910964524</p><br>
<a href="tel:9910964524" style="display:block;background:#1e1b4b;color:#fff;text-align:center;padding:12px;border-radius:10px;text-decoration:none">📞 Call 9910964524</a><br>
<a href="https://www.google.com/maps/search/?api=1&query=SFA+Classes" target="_blank" style="display:block;background:#fff;border:1px solid #ddd;color:#000;text-align:center;padding:12px;border-radius:10px;text-decoration:none">📍 Google Maps</a>
</div>
<button class="btn" style="background:#eee;color:#000;margin-top:8px" onclick="document.getElementById('tlog').style.display='none'">Close</button>
</div>
</div>

<script>
function goTo(i){
document.getElementById('sWrap').scrollTo({left:i*window.innerWidth,behavior:'smooth'});
}
function checkDot(){
let wrap=document.getElementById('sWrap');
let idx=Math.round(wrap.scrollLeft/window.innerWidth);
for(let j=0;j<4;j++){
let d=document.getElementById('d'+j);
if(d){ d.className = j===idx ? 'dot on' : 'dot'; }
}
}
function showTab(t){
document.getElementById('boxT').classList.toggle('hide',t!=='T');
document.getElementById('boxS').classList.toggle('hide',t!=='S');
document.getElementById('boxA').classList.toggle('hide',t!=='A');
document.getElementById('tT').style.background = t==='T'?'#1e1b4b':'#eee';
document.getElementById('tT').style.color = t==='T'?'#fff':'#000';
document.getElementById('tS').style.background = t==='S'?'#1e1b4b':'#eee';
document.getElementById('tS').style.color = t==='S'?'#fff':'#000';
document.getElementById('tA').style.background = t==='A'?'#1e1b4b':'#eee';
document.getElementById('tA').style.color = t==='A'?'#fff':'#000';
}
function teacherLogin(){
let a=document.getElementById('a').value;
let b=document.getElementById('b').value;
if(a==='admin' && b==='1234'){alert('Login OK - ab teacher panel bana dunga'); document.getElementById('tlog').style.display='none';}
else alert('admin / 1234 daalo');
}
</script>
</body>
</html>

<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SFA Classes</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#fffbeb;overflow:hidden}
#logoBtn{position:fixed;top:10px;left:10px;z-index:9999;background:#fff;padding:6px 12px;border-radius:12px;display:flex;gap:6px;align-items:center;border:none;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#sWrap{width:100vw;height:100vh;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth}
.page{min-width:100vw;height:100vh;scroll-snap-align:start;flex-shrink:0;background:#fffbeb;line-height:0}
#pg0 img{width:100vw;height:100vh;object-fit:fill;display:block}.pgOther img{width:100%;height:100%;object-fit:cover;display:block}
.dots{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:999}.dot{width:10px;height:10px;background:#bbb;border-radius:50%;border:2px solid #fff}.dot.active{background:#1e1b4b;width:28px;border-radius:10px}
.reviewBar{position:fixed;bottom:58px;left:10px;right:10px;background:#fff;border-radius:14px;padding:9px 12px;display:flex;gap:10px;align-items:center;z-index:999;box-shadow:0 4px 15px rgba(0,0,0,.2)}
.hide{display:none!important}.btn{width:100%;padding:13px;border:none;border-radius:10px;color:#fff;font-weight:bold;cursor:pointer}
input,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin-bottom:7px;background:#f8fafc}.tab{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabBtn{flex:1;padding:10px;border:none;border-radius:10px;font-weight:700;background:#f1f5f9;cursor:pointer}.tabBtn.on{background:#1e1b4b;color:#fff}.card{background:#fff;border-radius:14px;padding:12px;margin-bottom:8px;border:1px solid #f1f5f9}
</style></head><body>
<button id="logoBtn" onclick="document.getElementById('tlog').style.display='flex'"><img src="file_000000006f048211a0068b5f7a862720.jpg" style="width:30px;height:30px;border-radius:6px"><b style="font-size:12px;color:#1e1b4b">SFA Classes</b></button>
<div id="sWrap"><div class="page" id="pg0"><img src="sfa_banner.jpg"></div><div class="page pgOther"><img src="https://i.pravatar.cc/800?img=11"></div><div class="page pgOther"><img src="https://i.pravatar.cc/800?img=5"></div><div class="page pgOther"><img src="https://i.pravatar.cc/800?img=8"></div></div>
<div class="reviewBar"><img id="rvImg" src="https://i.pravatar.cc/80?img=32" style="width:38px;height:38px;border-radius:50%"><div style="flex:1"><b id="rvName" style="font-size:12px">Rahul</b><br><small id="rvText" style="font-size:11px">Best coaching!</small></div><small id="rvCount">1/3</small></div>
<div class="dots"><div class="dot active" id="d0" onclick="goToSlide(0)"></div><div class="dot" id="d1" onclick="goToSlide(1)"></div><div class="dot" id="d2" onclick="goToSlide(2)"></div><div class="dot" id="d3" onclick="goToSlide(3)"></div></div>

<div id="tlog" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99999;align-items:center;justify-content:center;padding:12px"><div style="background:#fff;border-radius:18px;padding:14px;width:100%;max-width:380px;max-height:90vh;overflow:auto">
<div class="tab"><button class="tabBtn on" id="btnT" onclick="showTab('T')">Teacher</button><button class="tabBtn" id="btnS" onclick="showTab('S')">Student</button><button class="tabBtn" id="btnA" onclick="showTab('A')">About</button></div>
<div id="boxT"><input id="a" placeholder="admin"><input id="b" type="password" placeholder="1234"><button class="btn" style="background:#1e1b4b" onclick="teacherLogin()">Teacher Login</button></div>
<div id="boxS" class="hide"><input id="sa" placeholder="Student ID"><input id="sb" type="password" placeholder="Password"><button class="btn" style="background:#16a34a" onclick="studentLogin()">Student Login</button></div>
<div id="boxA" class="hide"><div style="background:#fffaf0;border-radius:14px;padding:14px;border:1px solid #fde68a"><div style="display:flex;gap:12px;align-items:center"><img src="file_000000006f048211a0068b5f7a862720.jpg" style="width:52px;height:52px;border-radius:12px"><div><b style="font-size:14px;color:#1e1b4b">Nitish Sir</b><br><small style="background:#16a34a;color:#fff;padding:2px 6px;border-radius:6px;font-size:10px">Educator • 12+ Years</small></div></div><p style="font-size:12px;color:#444;line-height:1.6;margin-top:12px">🎯 <b>SFA Classes</b><br>👨‍🏫 <b>Founder:</b> Nitish Sir<br>💡 Small Batches, Personal Attention, Tests</p><div style="margin-top:12px;display:flex;flex-direction:column;gap:8px"><a href="tel:9910964524" style="background:#1e1b4b;color:#fff;text-decoration:none;padding:12px;border-radius:10px;text-align:center;font-weight:700">📞 Call</a><a href="https://wa.me/919910964524" style="background:#16a34a;color:#fff;text-decoration:none;padding:12px;border-radius:10px;text-align:center;font-weight:700">💬 WhatsApp</a></div></div></div>
<button class="btn" style="background:#eee;color:#000;margin-top:10px" onclick="document.getElementById('tlog').style.display='none'">Close</button></div></div>

<div id="td" class="hide" style="position:fixed;inset:0;background:#f8fafc;z-index:100000;max-width:430px;margin:auto;overflow:auto"><div style="background:#1e1b4b;color:#fff;padding:12px;display:flex;justify-content:space-between;position:sticky;top:0"><b>Teacher</b><button onclick="document.getElementById('td').classList.add('hide')" style="background:#fff;color:#1e1b4b;border:none;padding:6px 12px;border-radius:8px">X</button></div><div class="tab" style="padding:6px;background:#fff;position:sticky;top:44px"><button class="tabBtn on" id="tabStu" onclick="openTab('Stu')">Students</button><button class="tabBtn" id="tabQuiz" onclick="openTab('Quiz')">Quiz</button><button class="tabBtn" id="tabResult" onclick="openTab('Result')">Results</button></div>
<div id="panelStudents" style="padding:12px"><div class="card"><b>Add Student</b><br><br><input type="file" id="stuPhotoInput" accept="image/*"><input id="stuName" placeholder="Name"><input id="stuId" placeholder="ID"><input id="stuPass" type="password" placeholder="Password"><input id="stuClass" placeholder="Class"><button class="btn" style="background:#16a34a" onclick="addStudent()">Add Student</button><div id="stuList" style="margin-top:12px"></div></div></div>
<div id="panelQuiz" class="hide" style="padding:12px"><div class="card"><b>📝 Quiz + Date Wise Expiry</b><br><br><input id="quizTitle" placeholder="Quiz Title - GK Test"><input id="quizTime" type="number" placeholder="Time Limit Minutes - 10"><label style="font-size:12px;font-weight:bold;margin:6px 0 2px 2px;display:block">📅 Live Till (Kab Tak Live Rahega)</label><input id="quizExpiry" type="datetime-local" style="border:2px solid #16a34a"><div style="background:#fef3c7;padding:10px;border-radius:10px;margin:8px 0"><input id="qText" placeholder="Question"><input id="optA" placeholder="A"><input id="optB" placeholder="B"><input id="optC" placeholder="C"><input id="optD" placeholder="D"><select id="correctAns"><option value="0">Correct A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select><button class="btn" style="background:#d97706" onclick="addQuestion()">+ Add Q</button></div><div id="qList"></div><button class="btn" style="background:#1e1b4b;margin-top:10px" onclick="saveQuiz()">Save Quiz</button><div id="allQuizList" style="margin-top:12px"></div></div></div>
<div id="panelResult" class="hide" style="padding:12px"><div class="card"><b>Results</b><div id="resultList"></div></div></div></div>

<div id="sdash" class="hide" style="position:fixed;inset:0;background:#f0fdf4;z-index:100002;max-width:430px;margin:auto;overflow:auto"><div style="background:#16a34a;color:#fff;padding:14px;display:flex;justify-content:space-between"><b>Student</b><button onclick="document.getElementById('sdash').classList.add('hide')" style="background:#fff;color:#16a34a;border:none;padding:6px 12px;border-radius:8px">X</button></div><div style="padding:14px"><div class="card" style="text-align:center"><img id="sdPhoto" style="width:80px;height:80px;border-radius:50%"><br><b id="sdName"></b><br><small id="sdId"></small></div><div class="card"><b>Available Quiz</b><div id="studentQuizList"></div></div></div></div>

<div id="quizPage" class="hide" style="position:fixed;inset:0;background:#fff;z-index:200000;overflow:auto;padding:12px"><div style="max-width:430px;margin:auto"><div style="display:flex;justify-content:space-between;background:#1e1b4b;color:#fff;padding:12px;border-radius:12px"><b id="quizPageTitle">Quiz</b><b id="timer" style="background:#ef4444;padding:6px 10px;border-radius:8px">00:00</b></div><div style="background:#fef3c7;border-radius:8px;padding:8px;font-size:11px;margin:10px 0"><span id="cheatStatus">🟢 Tab check ON</span> | <span id="tabWarn">Switch 0/3</span><br><video id="cam" autoplay muted playsinline style="width:100%;height:80px;background:#000;border-radius:8px;margin-top:6px"></video></div><div id="quizQArea" class="card"></div><button class="btn" style="background:#16a34a" onclick="nextQuestion()">Next / Submit</button></div></div>
<div id="quizResultPage" class="hide" style="position:fixed;inset:0;background:#f0fdf4;z-index:200001;padding:14px"><div style="max-width:430px;margin:auto"><div class="card" style="text-align:center"><h1 id="finalScore">0/0</h1><p id="finalMsg"></p><button class="btn" style="background:#1e1b4b" onclick="document.getElementById('quizResultPage').classList.add('hide')">Close</button></div><div id="finalDetails"></div></div></div>

<script>
var sWrap=document.getElementById('sWrap');
function goToSlide(i){ if(sWrap) sWrap.scrollTo({left:i*sWrap.clientWidth,behavior:'smooth'}); }
function updateDots(){ if(!sWrap) return; var idx=Math.round(sWrap.scrollLeft/sWrap.clientWidth); for(var j=0;j<4;j++){var d=document.getElementById('d'+j); if(d) d.className=j===idx?'dot active':'dot';}}
if(sWrap) sWrap.addEventListener('scroll',updateDots);
function showTab(t){document.getElementById('btnT').className=t==='T'?'tabBtn on':'tabBtn';document.getElementById('btnS').className=t==='S'?'tabBtn on':'tabBtn';document.getElementById('btnA').className=t==='A'?'tabBtn on':'tabBtn';document.getElementById('boxT').classList.toggle('hide',t!=='T');document.getElementById('boxS').classList.toggle('hide',t!=='S');document.getElementById('boxA').classList.toggle('hide',t!=='A');}
var reviews=[{n:'Rahul',t:'Best coaching!'},{n:'Priya',t:'95% aaya!'},{n:'Aman',t:'Small batches!'}]; var ri=0;
function showReview(){var r=reviews[ri];document.getElementById('rvName').innerText=r.n;document.getElementById('rvText').innerText=r.t;document.getElementById('rvCount').innerText=(ri+1)+'/3';}
showReview(); setInterval(function(){ri=(ri+1)%3; showReview();},5000);

var tempQuestions=[]; var currentQuiz=null, currentQIndex=0, userAnswers=[], timeLeft=0, timerInt=null, tabSwitchCount=0, camStream=null, tmpStuPhoto='';
function teacherLogin(){var id=document.getElementById('a').value.trim();var p=document.getElementById('b').value.trim();if(id==='admin'&&p==='1234'){document.getElementById('tlog').style.display='none';document.getElementById('td').classList.remove('hide');loadAll();loadQuizzes();loadResults();}else alert('admin / 1234');}
function studentLogin(){var id=document.getElementById('sa').value.trim();var p=document.getElementById('sb').value.trim();var arr=JSON.parse(localStorage.getItem('sfa_students')||'[]');var f=arr.find(s=>s.id===id&&s.pass===p);if(!f) return alert('Student nahi mila');document.getElementById('tlog').style.display='none';document.getElementById('sdPhoto').src=f.photo||'https://i.pravatar.cc/80';document.getElementById('sdName').innerText=f.name;document.getElementById('sdId').innerText=f.id;window.currentStudent=f;loadStudentQuizzes();document.getElementById('sdash').classList.remove('hide');}
function openTab(t){document.getElementById('panelStudents').classList.toggle('hide',t!=='Stu');document.getElementById('panelQuiz').classList.toggle('hide',t!=='Quiz');document.getElementById('panelResult').classList.toggle('hide',t!=='Result');document.getElementById('tabStu').className=t==='Stu'?'tabBtn on':'tabBtn';document.getElementById('tabQuiz').className=t==='Quiz'?'tabBtn on':'tabBtn';document.getElementById('tabResult').className=t==='Result'?'tabBtn on':'tabBtn'; if(t==='Result') loadResults();}
document.getElementById('stuPhotoInput').addEventListener('change',function(e){var r=new FileReader();r.onload=function(ev){tmpStuPhoto=ev.target.result};r.readAsDataURL(e.target.files[0]);});
function loadAll(){var arr=JSON.parse(localStorage.getItem('sfa_students')||'[]');var h='';for(var i=0;i<arr.length;i++){var s=arr[i];h+='<div class="card"><b>'+s.name+'</b> ID:'+s.id+' Class:'+s.class+'</div>';}document.getElementById('stuList').innerHTML=h||'No students';}
function addStudent(){var name=document.getElementById('stuName').value.trim();var id=document.getElementById('stuId').value.trim();var pass=document.getElementById('stuPass').value.trim();var cls=document.getElementById('stuClass').value.trim();if(!name||!id||!pass) return alert('Bharo');var arr=JSON.parse(localStorage.getItem('sfa_students')||'[]');arr.push({name:name,id:id,pass:pass,class:cls,photo:tmpStuPhoto||'https://i.pravatar.cc/80'});localStorage.setItem('sfa_students',JSON.stringify(arr));loadAll();}

function addQuestion(){var q=document.getElementById('qText').value.trim();var a=document.getElementById('optA').value.trim();var b=document.getElementById('optB').value.trim();var c=document.getElementById('optC').value.trim();var d=document.getElementById('optD').value.trim();var corr=parseInt(document.getElementById('correctAns').value);if(!q||!a||!b||!c||!d) return alert('Sab bharo');if(tempQuestions.length>=20) return alert('20 max');tempQuestions.push({q:q,opts:[a,b,c,d],correct:corr});document.getElementById('qText').value='';document.getElementById('optA').value='';document.getElementById('optB').value='';document.getElementById('optC').value='';document.getElementById('optD').value='';renderTempQ();}
function renderTempQ(){var h='';for(var i=0;i<tempQuestions.length;i++){h+='<div style="background:#fff;padding:6px;border-radius:6px;margin-bottom:4px;font-size:11px">'+(i+1)+'. '+tempQuestions[i].q.slice(0,30)+' <button onclick="tempQuestions.splice('+i+',1);renderTempQ()" style="background:#fee;border:none;padding:2px 6px">X</button></div>';}document.getElementById('qList').innerHTML=h+'<small>'+tempQuestions.length+'/20</small>';}
function saveQuiz(){
var title=document.getElementById('quizTitle').value.trim();
var time=parseInt(document.getElementById('quizTime').value);
var expiry=document.getElementById('quizExpiry').value;
if(!title||!time) return alert('Title Time bharo');
if(!expiry) return alert('Live Till Date select karo');
if(tempQuestions.length==0) return alert('1 Q add karo');
var quizzes=JSON.parse(localStorage.getItem('sfa_quizzes')||'[]');
quizzes.push({id:Date.now(),title:title,time:time,expiry:expiry,questions:tempQuestions.slice()});
localStorage.setItem('sfa_quizzes',JSON.stringify(quizzes));
tempQuestions=[];renderTempQ();
document.getElementById('quizTitle').value='';document.getElementById('quizTime').value='';document.getElementById('quizExpiry').value='';
loadQuizzes();alert('Saved! Live till: '+expiry);
}
function loadQuizzes(){
var quizzes=JSON.parse(localStorage.getItem('sfa_quizzes')||'[]');
var now=new Date(); var h='';
for(var i=0;i<quizzes.length;i++){
var exp=new Date(quizzes[i].expiry);
var isExpired=now>exp;
h+='<div class="card" style="border-left:4px solid '+(isExpired?'#ef4444':'#16a34a')+'"><b>'+quizzes[i].title+'</b> '+quizzes[i].questions.length+'Qs '+quizzes[i].time+'min<br><small>Live till: '+exp.toLocaleString('en-IN')+' '+(isExpired?'(EXPIRED)':'(Active)')+'</small><br><button onclick="deleteQuiz('+i+')" style="background:#fee;border:none;padding:4px 8px;margin-top:6px">Delete</button></div>';
}
document.getElementById('allQuizList').innerHTML=h||'No quiz';
}
function deleteQuiz(i){var q=JSON.parse(localStorage.getItem('sfa_quizzes')||'[]');q.splice(i,1);localStorage.setItem('sfa_quizzes',JSON.stringify(q));loadQuizzes();}
function loadStudentQuizzes(){
var quizzes=JSON.parse(localStorage.getItem('sfa_quizzes')||'[]');
var results=JSON.parse(localStorage.getItem('sfa_results')||'[]');
var now=new Date(); var h='';
for(var i=0;i<quizzes.length;i++){
var qq=quizzes[i];
if(!qq.expiry) continue;
var expiryDate=new Date(qq.expiry);
if(now > expiryDate) continue;
var done=results.find(r=>r.quizId===qq.id && r.studentId===window.currentStudent.id);
var liveTill=expiryDate.toLocaleString('en-IN');
h+='<div class="card"><b>'+qq.title+'</b><br><small>'+qq.questions.length+'Q '+qq.time+'min | Live till: '+liveTill+'</small><br>'+(done?'<b style="color:green">Score '+done.score+'/'+qq.questions.length+'</b>':'<button class="btn" style="background:#1e1b4b;margin-top:6px" onclick="startQuiz('+qq.id+')">Start Quiz</button>')+'</div>';
}
document.getElementById('studentQuizList').innerHTML=h||'No active quiz (sab expire ho gaye)';
}
async function startQuiz(id){var quizzes=JSON.parse(localStorage.getItem('sfa_quizzes')||'[]');currentQuiz=quizzes.find(q=>q.id===id);if(!currentQuiz) return;var now=new Date();if(now>new Date(currentQuiz.expiry)) return alert('Quiz Expired!');if(!confirm('Camera ON hoga, Tab change pe auto-submit')) return;try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});document.getElementById('cam').srcObject=camStream;}catch(e){alert('Camera allow karo');return;}currentQIndex=0;userAnswers=new Array(currentQuiz.questions.length).fill(null);tabSwitchCount=0;timeLeft=currentQuiz.time*60;document.getElementById('quizPage').classList.remove('hide');document.getElementById('sdash').classList.add('hide');document.addEventListener('visibilitychange',handleVis);startTimer();showQ();}
function handleVis(){if(document.hidden){tabSwitchCount++;document.getElementById('tabWarn').innerText='Switch '+tabSwitchCount+'/3';if(tabSwitchCount>=3) submitQuiz('Tab Cheating');}}
function startTimer(){clearInterval(timerInt);timerInt=setInterval(function(){timeLeft--;var m=Math.floor(timeLeft/60);var s=timeLeft%60;document.getElementById('timer').innerText=(m<10?'0'+m:m)+':'+(s<10?'0'+s:s);if(timeLeft<=0) submitQuiz('Time Over');},1000);}
function showQ(){var q=currentQuiz.questions[currentQIndex];var html='<b>Q'+(currentQIndex+1)+'/'+currentQuiz.questions.length+'</b><p style="font-weight:700;margin:10px 0">'+q.q+'</p>';for(var i=0;i<q.opts.length;i++){var sel=userAnswers[currentQIndex]===i?'background:#1e1b4b;color:#fff':'';html+='<button onclick="selectOpt('+i+')" style="width:100%;text-align:left;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:8px;background:#fff;'+sel+'">'+String.fromCharCode(65+i)+'. '+q.opts[i]+'</button>';}document.getElementById('quizQArea').innerHTML=html;}
function selectOpt(i){userAnswers[currentQIndex]=i;showQ();}
function nextQuestion(){if(userAnswers[currentQIndex]===null) return alert('Option select karo');if(currentQIndex<currentQuiz.questions.length-1){currentQIndex++;showQ();}else submitQuiz('Completed');}
function submitQuiz(reason){clearInterval(timerInt);document.removeEventListener('visibilitychange',handleVis);if(camStream){camStream.getTracks().forEach(t=>t.stop());}var score=0;for(var i=0;i<currentQuiz.questions.length;i++){if(userAnswers[i]===currentQuiz.questions[i].correct) score++;}var res=JSON.parse(localStorage.getItem('sfa_results')||'[]');res.push({quizId:currentQuiz.id,quizTitle:currentQuiz.title,studentId:window.currentStudent.id,studentName:window.currentStudent.name,score:score,total:currentQuiz.questions.length,reason:reason,date:new Date().toLocaleString()});localStorage.setItem('sfa_results',JSON.stringify(res));document.getElementById('quizPage').classList.add('hide');document.getElementById('f

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SFA Classes</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#fef9e8;overflow:hidden}
#logoBtn{position:fixed;top:10px;left:10px;z-index:9999;background:#fff;padding:6px 12px;border-radius:12px;border:none;display:flex;align-items:center;gap:6px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
#sWrap{width:100vw;height:100vh;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth}
#sWrap::-webkit-scrollbar{display:none}
.page{min-width:100vw;width:100vw;height:100vh;scroll-snap-align:start;flex-shrink:0;position:relative;background:#fef9e8;overflow:hidden;display:flex;align-items:center;justify-content:center}
.page img{display:block;width:100%;height:100%;}
#pg0 img{object-fit:contain;background:#fef9e8}
.pgOther img{object-fit:contain;background:#000;}
.dots{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:999}
.dot{width:12px;height:12px;background:#bbb;border-radius:50%;border:2px solid #fff}
.dot.on{background:#1e1b4b;width:28px;border-radius:10px}
.reviewBar{position:fixed;bottom:60px;left:10px;right:10px;background:#fff;border-radius:12px;padding:8px 10px;display:flex;gap:8px;align-items:center;z-index:999;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.hide{display:none!important}
.btn{width:100%;padding:12px;border:none;border-radius:10px;color:#fff;font-weight:bold}
input{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin-bottom:6px}
</style>
</head>
<body>
<button id="logoBtn" onclick="document.getElementById('tlog').style.display='flex'">
<img src="file_000000006f048211a0068b5f7a862720.jpg" style="width:30px;height:30px;border-radius:6px" onerror="this.src='https://via.placeholder.com/30'">
<b style="font-size:12px;color:#1e1b4b">SFA Classes</b>
</button>

<div id="sWrap" onscroll="checkDot()">
<div class="page" id="pg0"><img src="sfa_banner.jpg" onerror="this.src='https://i.imgur.com/Q6a2Q2a.jpeg'"></div>
<div class="page pgOther"><img id="img1" src="https://i.pravatar.cc/800?img=11"></div>
<div class="page pgOther"><img id="img2" src="https://i.pravatar.cc/800?img=5"></div>
<div class="page pgOther"><img id="img3" src="https://i.pravatar.cc/800?img=8"></div>
</div>

<div class="reviewBar"><img src="https://i.pravatar.cc/40?img=32" style="width:36px;height:36px;border-radius:50%"><div><b style="font-size:12px">Rahul</b><p style="font-size:11px">Best coaching!</p></div></div>

<div class="dots">
<div class="dot on" id="d0" onclick="goTo(0)"></div>
<div class="dot" id="d1" onclick="goTo(1)"></div>
<div class="dot" id="d2" onclick="goTo(2)"></div>
<div class="dot" id="d3" onclick="goTo(3)"></div>
</div>

<div id="tlog" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99999;align-items:center;justify-content:center;padding:12px">
<div style="background:#fff;border-radius:16px;padding:14px;width:100%;max-width:360px">
<div style="display:flex;gap:6px;margin-bottom:10px">
<button onclick="showTab('T')" style="flex:1;padding:10px;background:#1e1b4b;color:#fff;border:none;border-radius:8px;font-weight:700">Teacher</button>
<button onclick="showTab('S')" style="flex:1;padding:10px;background:#eee;border:none;border-radius:8px">Student</button>
<button onclick="showTab('A')" style="flex:1;padding:10px;background:#eee;border:none;border-radius:8px">About</button>
</div>
<div id="boxT"><input id="a" placeholder="admin"><input id="b" type="password" placeholder="1234"><button class="btn" style="background:#1e1b4b" onclick="teacherLogin()">Login</button></div>
<div id="boxS" class="hide"><input placeholder="student"><button class="btn" style="background:#16a34a" onclick="alert('ok')">Login</button></div>
<div id="boxA" class="hide"><b>Nitish Sir - 12+ Years</b><br><p style="font-size:12px">Mobile: 9910964524</p><br><a href="tel:9910964524" style="display:block;background:#1e1b4b;color:#fff;text-align:center;padding:12px;border-radius:10px;text-decoration:none">Call</a></div>
<button class="btn" style="background:#eee;color:#000;margin-top:8px" onclick="document.getElementById('tlog').style.display='none'">Close</button>
</div>
</div>

<div id="tdash" class="hide" style="position:fixed;inset:0;background:#f8fafc;z-index:100000;max-width:430px;margin:auto;overflow:auto">
<div style="background:#1e1b4b;color:#fff;padding:12px;display:flex;justify-content:space-between"><b>Teacher Panel</b><button onclick="document.getElementById('tdash').classList.add('hide')" style="background:#fff;color:#1e1b4b;border:none;padding:6px 12px;border-radius:8px">X</button></div>
<div style="padding:12px"><p style="font-size:12px">Photo change yahan se karo:</p><br>
<input type="file" id="ph0" accept="image/*"><button class="btn" style="background:#000" onclick="saveP(0)">Save SFA Banner</button><br><br>
<input type="file" id="ph1" accept="image/*"><button class="btn" style="background:#1e1b4b" onclick="saveP(1)">Save Photo 2</button><br><br>
<input type="file" id="ph2" accept="image/*"><button class="btn" style="background:#16a34a" onclick="saveP(2)">Save Photo 3</button><br><br>
<input type="file" id="ph3" accept="image/*"><button class="btn" style="background:#f59e0b" onclick="saveP(3)">Save Photo 4</button>
</div>
</div>

<script>
function goTo(i){document.getElementById('sWrap').scrollTo({left:i*window.innerWidth,behavior:'smooth'});}
function checkDot(){let w=document.getElementById('sWrap');let idx=Math.round(w.scrollLeft/window.innerWidth);for(let j=0;j<4;j++){let d=document.getElementById('d'+j);if(d)d.className=j===idx?'dot on':'dot';}}
function showTab(t){document.getElementById('boxT').classList.toggle('hide',t!=='T');document.getElementById('boxS').classList.toggle('hide',t!=='S');document.getElementById('boxA').classList.toggle('hide',t!=='A');}
function teacherLogin(){if(a.value==='admin'&&b.value==='1234'){tlog.style.display='none';tdash.classList.remove('hide');}else alert('admin/1234');}
let tmp={};
ph0.onchange=e=>{let r=new FileReader();r.onload=ev=>tmp[0]=ev.target.result;r.readAsDataURL(e.target.files[0])};
ph1.onchange=e=>{let r=new FileReader();r.onload=ev=>tmp[1]=ev.target.result;r.readAsDataURL(e.target.files[0])};
ph2.onchange=e=>{let r=new FileReader();r.onload=ev=>tmp[2]=ev.target.result;r.readAsDataURL(e.target.files[0])};
ph3.onchange=e=>{let r=new FileReader();r.onload=ev=>tmp[3]=ev.target.result;r.readAsDataURL(e.target.files[0])};
function saveP(i){if(!tmp[i])return alert('Select karo');if(i==0)document.querySelector('#pg0 img').src=tmp[i];else document.getElementById('img'+i).src=tmp[i];localStorage.setItem('p'+i,tmp[i]);alert('Saved');}
let s0=localStorage.getItem('p0');if(s0)document.querySelector('#pg0 img').src=s0;
let s1=localStorage.getItem('p1');if(s1)document.getElementById('img1').src=s1;
let s2=localStorage.getItem('p2');if(s2)document.getElementById('img2').src=s2;
let s3=localStorage.getItem('p3');if(s3)document.getElementById('img3').src=s3;
</script>
</body>
</html>

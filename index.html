<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SFA Classes</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;overflow:hidden}
.top{position:fixed;top:10px;left:12px;z-index:60}
.logo{background:rgba(255,255,255,0.96);padding:5px 10px 5px 5px;border-radius:12px;display:flex;gap:6px;align-items:center;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.sWrap{width:100vw;height:100vh;overflow-x:auto;overflow-y:hidden;display:flex;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.sWrap::-webkit-scrollbar{display:none}
.page{min-width:100vw;width:100vw;height:100vh;scroll-snap-align:start;flex-shrink:0;position:relative;background:#fffaf0;display:flex;align-items:center;justify-content:center}
.page img.bg{width:100%;height:100%;object-fit:contain;background:#fffaf0}
.page img.cover{object-fit:cover;background:#000}
/* Bottom Review - sab slides pe dikhega */
.reviewBar{position:fixed;bottom:50px;left:10px;right:10px;z-index:45;background:rgba(255,255,255,0.97);backdrop-filter:blur(10px);border-radius:14px;padding:10px 12px;box-shadow:0 4px 20px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;max-width:410px;margin:auto}
.dots{position:fixed;bottom:18px;left:0;right:0;z-index:40;display:flex;justify-content:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.5);transition:.3s}
.dot.active{background:#fff;width:24px;border-radius:10px}
.hide{display:none}
.btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:bold;color:#fff}
input,textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin-bottom:8px;background:#f8fafc}
</style>
</head>
<body>

<div class="top">
<div class="logo" onclick="openT()">
<img src="file_000000006f048211a0068b5f7a862720.jpg" style="width:30px;height:30px;border-radius:8px;object-fit:cover">
<div><b style="font-size:11px;color:#1e1b4b">SFA Classes</b><br><small style="font-size:9px;color:#16a34a;font-weight:700">Study for all</small></div>
</div>
</div>

<div id="sWrap" class="sWrap">
<!-- PAGE 1 BANNER - AB PURA DIKHEGA CONTAIN SE -->
<div class="page"><img class="bg" src="sfa_banner.jpg"></div>
<!-- PAGE 2 STUDENT ONLY PHOTO -->
<div class="page" style="background:#000"><img class="bg cover" id="img1" src="https://i.pravatar.cc/800?img=11"></div>
<!-- PAGE 3 -->
<div class="page" style="background:#000"><img class="bg cover" id="img2" src="https://i.pravatar.cc/800?img=5"></div>
<!-- PAGE 4 -->
<div class="page" style="background:#000"><img class="bg cover" id="img3" src="https://i.pravatar.cc/800?img=8"></div>
</div>

<!-- REVIEW BAR - SAB SLIDES PE DIKHEGA -->
<div class="reviewBar" id="reviewBar" onclick="openT()">
<img id="rvImg" src="https://i.pravatar.cc/80?img=32" style="width:38px;height:38px;border-radius:50%;object-fit:cover">
<div style="flex:1"><div style="display:flex;gap:6px;align-items:center"><b id="rvName" style="font-size:12px">Rahul Kumar</b><small style="color:#f59e0b;font-size:11px">★★★★★</small></div><p id="rvText" style="font-size:11px;color:#555;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">SFA Classes ne meri life badal di! Best teachers ❤️</p></div>
<div style="background:#f1f5f9;padding:6px 8px;border-radius:8px;font-size:10px">💬</div>
</div>

<div class="dots"><div class="dot active"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

<div id="tlog" class="hide" style="position:fixed;inset:0;background:#fff;z-index:100;padding:16px;max-width:430px;margin:auto"><div style="background:#fff;border-radius:18px;padding:16px;margin-top:30px;box-shadow:0 4px 15px rgba(0,0,0,.08)"><h3>Teacher Login</h3><p style="font-size:11px;color:#888;margin-top:4px">Logo pe click kiya - yaha login karo</p><br><input id="a" placeholder="ID = admin"><input id="b" type="password" placeholder="Pass = 1234"><button class="btn" style="background:#1e1b4b" onclick="lt()">Login</button><button class="btn" style="background:#eee;color:#000;margin-top:8px" onclick="gh()">Back</button></div></div>

<div id="td" class="hide" style="position:fixed;inset:0;background:#fffafb;z-index:100;padding:12px;max-width:430px;margin:auto;overflow:auto">
<div style="display:flex;justify-content:space-between;align-items:center"><b>Teacher Panel</b><span onclick="gh()" style="background:#eee;padding:6px 10px;border-radius:8px">X</span></div>

<div style="background:#fff;border-radius:16px;padding:12px;margin-top:12px;border:2px solid #e0e7ff"><b>💬 Bottom Review Update (Sab slides pe dikhega)</b><br><br><input id="rn" placeholder="Student Name"><textarea id="rt" placeholder="Review text"></textarea><input id="rph" type="file" accept="image/*"><button class="btn" style="background:#1e1b4b" onclick="saveR()">Save Review</button></div>

<div style="background:#fff;border-radius:16px;padding:12px;margin-top:12px"><b>Slide 2 - Student Photo 1</b><br><br><input id="ph1" type="file" accept="image/*"><button class="btn" style="background:#1e1b4b" onclick="save(1)">Save Photo 1</button></div>
<div style="background:#fff;border-radius:16px;padding:12px;margin-top:12px"><b>Slide 3 - Student Photo 2</b><br><br><input id="ph2" type="file" accept="image/*"><button class="btn" style="background:#16a34a" onclick="save(2)">Save Photo 2</button></div>
<div style="background:#fff;border-radius:16px;padding:12px;margin-top:12px"><b>Slide 4 - Student Photo 3</b><br><br><input id="ph3" type="file" accept="image/*"><button class="btn" style="background:#f59e0b" onclick="save(3)">Save Photo 3</button></div>
</div>

<script>
let photos=JSON.parse(localStorage.getItem('sfa_photos')||'null')||{p1:'https://i.pravatar.cc/800?img=11',p2:'https://i.pravatar.cc/800?img=5',p3:'https://i.pravatar.cc/800?img=8'};
let review=JSON.parse(localStorage.getItem('sfa_review')||'null')||{n:'Rahul Kumar',t:'SFA Classes ne meri life badal di! Best teachers ❤️',p:'https://i.pravatar.cc/80?img=32'};
let tmp={1:'',2:'',3:'',r:''};
let wrap=document.getElementById('sWrap'),dots=document.querySelectorAll('.dot');
function updateDots(){let i=Math.round(wrap.scrollLeft/window.innerWidth);dots.forEach((d,j)=>d.classList.toggle('active',j===i))}
wrap.addEventListener('scroll',updateDots);
dots.forEach((d,i)=>d.addEventListener('click',()=>{wrap.scrollTo({left:i*window.innerWidth,behavior:'smooth'})}));
function openT(){document.getElementById('tlog').classList.remove('hide')}
function gh(){document.getElementById('tlog').classList.add('hide');document.getElementById('td').classList.add('hide');load()}
function lt(){if(document.getElementById('a').value==='admin'&&document.getElementById('b').value==='1234'){document.getElementById('tlog').classList.add('hide');document.getElementById('td').classList.remove('hide')}else alert('admin / 1234')}
function load(){document.getElementById('img1').src=photos.p1;document.getElementById('img2').src=photos.p2;document.getElementById('img3').src=photos.p3;document.getElementById('rvName').innerText=review.n;document.getElementById('rvText').innerText=review.t;document.getElementById('rvImg').src=review.p;document.getElementById('rn').value=review.n;document.getElementById('rt').value=review.t;}
function save(i){if(!tmp[i])return alert('Photo select karo');photos['p'+i]=tmp[i];localStorage.setItem('sfa_photos',JSON.stringify(photos));load();alert('Photo '+i+' Saved!')}
function saveR(){let n=document.getElementById('rn').value,t=document.getElementById('rt').value;if(!n||!t)return alert('Name + Review likho');review.n=n;review.t=t;if(tmp.r)review.p=tmp.r;localStorage.setItem('sfa_review',JSON.stringify(review));load();alert('Review Saved! Ab sab slides pe dikhega ✅')}
document.getElementById('ph1').addEventListener('change',e=>{let r=new FileReader();r.onload=ev=>tmp[1]=ev.target.result;r.readAsDataURL(e.target.files[0])});
document.getElementById('ph2').addEventListener('change',e=>{let r=new FileReader();r.onload=ev=>tmp[2]=ev.target.result;r.readAsDataURL(e.target.files[0])});
document.getElementById('ph3').addEventListener('change',e=>{let r=new FileReader();r.onload=ev=>tmp[3]=ev.target.result;r.readAsDataURL(e.target.files[0])});
document.getElementById('rph').addEventListener('change',e=>{let r=new FileReader();r.onload=ev=>tmp.r=ev.target.result;r.readAsDataURL(e.target.files[0])});
load();
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SFA Classes</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;overflow:hidden}
.top{position:fixed;top:10px;left:12px;z-index:50}
.logo{background:rgba(255,255,255,0.94);padding:5px 10px 5px 5px;border-radius:12px;display:flex;gap:6px;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.sWrap{width:100vw;height:100vh;overflow-x:auto;overflow-y:hidden;display:flex;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.sWrap::-webkit-scrollbar{display:none}
.page{min-width:100vw;width:100vw;height:100vh;scroll-snap-align:start;flex-shrink:0;position:relative;background:#000}
.page img.bg{width:100%;height:100%;object-fit:cover}
.dots{position:fixed;bottom:20px;left:0;right:0;z-index:40;display:flex;justify-content:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.5);transition:.3s}
.dot.active{background:#fff;width:24px;border-radius:10px}
.hide{display:none}
.btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:bold;color:#fff}
input{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin-bottom:8px;background:#f8fafc}
</style>
</head>
<body>

<div class="top">
<div class="logo" onclick="openT()">
<img src="file_000000006f048211a0068b5f7a862720.jpg" style="width:30px;height:30px;border-radius:8px;object-fit:cover">
<div><b style="font-size:11px;color:#1e1b4b">SFA Classes</b><br><small style="font-size:9px;color:#16a34a;font-weight:700">Study for all</small></div>
</div>
</div>

<div id="sWrap" class="sWrap">
<!-- PAGE 1 BANNER -->
<div class="page"><img class="bg" src="sfa_banner.jpg"></div>
<!-- PAGE 2 STUDENT 1 ONLY PHOTO -->
<div class="page"><img class="bg" id="img1" src="https://i.pravatar.cc/800?img=11"></div>
<!-- PAGE 3 STUDENT 2 ONLY PHOTO -->
<div class="page"><img class="bg" id="img2" src="https://i.pravatar.cc/800?img=5"></div>
<!-- PAGE 4 STUDENT 3 ONLY PHOTO -->
<div class="page"><img class="bg" id="img3" src="https://i.pravatar.cc/800?img=8"></div>
</div>

<div class="dots"><div class="dot active"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

<div id="tlog" class="hide" style="position:fixed;inset:0;background:#fff;z-index:100;padding:16px;max-width:430px;margin:auto"><div style="background:#fff;border-radius:18px;padding:16px;margin-top:30px;box-shadow:0 4px 15px rgba(0,0,0,.08)"><h3>Teacher Login</h3><br><input id="a" placeholder="admin"><input id="b" type="password" placeholder="1234"><button class="btn" style="background:#1e1b4b" onclick="lt()">Login</button><button class="btn" style="background:#eee;color:#000;margin-top:8px" onclick="gh()">Back</button></div></div>

<div id="td" class="hide" style="position:fixed;inset:0;background:#fffafb;z-index:100;padding:12px;max-width:430px;margin:auto;overflow:auto">
<div style="display:flex;justify-content:space-between;align-items:center"><b>Update Student Photos</b><span onclick="gh()" style="background:#eee;padding:6px 10px;border-radius:8px">X</span></div>
<div style="background:#fff;border-radius:16px;padding:12px;margin-top:12px"><b>Student 1 (Slide 2)</b><br><br><input id="ph1" type="file" accept="image/*"><button class="btn" style="background:#1e1b4b" onclick="save(1)">Save Photo 1</button></div>
<div style="background:#fff;border-radius:16px;padding:12px;margin-top:12px"><b>Student 2 (Slide 3)</b><br><br><input id="ph2" type="file" accept="image/*"><button class="btn" style="background:#16a34a" onclick="save(2)">Save Photo 2</button></div>
<div style="background:#fff;border-radius:16px;padding:12px;margin-top:12px"><b>Student 3 (Slide 4)</b><br><br><input id="ph3" type="file" accept="image/*"><button class="btn" style="background:#f59e0b" onclick="save(3)">Save Photo 3</button></div>
<p style="font-size:11px;color:#888;margin-top:12px;text-align:center">Logo pe click karke Teacher Login hota hai</p>
</div>

<script>
let data=JSON.parse(localStorage.getItem('sfa_photos')||'null')||{p1:'https://i.pravatar.cc/800?img=11',p2:'https://i.pravatar.cc/800?img=5',p3:'https://i.pravatar.cc/800?img=8'};
let tmp={1:'',2:'',3:''};
let wrap=document.getElementById('sWrap'),dots=document.querySelectorAll('.dot');
function updateDots(){let i=Math.round(wrap.scrollLeft/window.innerWidth);dots.forEach((d,j)=>d.classList.toggle('active',j===i))}
wrap.addEventListener('scroll',updateDots);
dots.forEach((d,i)=>d.addEventListener('click',()=>{wrap.scrollTo({left:i*window.innerWidth,behavior:'smooth'})}));
function openT(){document.getElementById('tlog').classList.remove('hide')}
function gh(){document.getElementById('tlog').classList.add('hide');document.getElementById('td').classList.add('hide')}
function lt(){if(document.getElementById('a').value==='admin'&&document.getElementById('b').value==='1234'){document.getElementById('tlog').classList.add('hide');document.getElementById('td').classList.remove('hide')}else alert('admin / 1234')}
function load(){document.getElementById('img1').src=data.p1;document.getElementById('img2').src=data.p2;document.getElementById('img3').src=data.p3;}
function save(i){if(!tmp[i])return alert('Pehle photo select karo');data['p'+i]=tmp[i];localStorage.setItem('sfa_photos',JSON.stringify(data));load();alert('Photo '+i+' Saved!');}
document.getElementById('ph1').addEventListener('change',e=>{let r=new FileReader();r.onload=ev=>tmp[1]=ev.target.result;r.readAsDataURL(e.target.files[0])});
document.getElementById('ph2').addEventListener('change',e=>{let r=new FileReader();r.onload=ev=>tmp[2]=ev.target.result;r.readAsDataURL(e.target.files[0])});
document.getElementById('ph3').addEventListener('change',e=>{let r=new FileReader();r.onload=ev=>tmp[3]=ev.target.result;r.readAsDataURL(e.target.files[0])});
load();
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SFA Classes</title>
<style>
body{margin:0;font-family:Arial;background:#fffafb}
.box{max-width:430px;margin:auto;padding:10px}
.banner{position:relative;border-radius:18px;overflow:hidden}
.banner img{width:100%;display:block}
.logo{position:absolute;top:10px;left:10px;background:#fff;padding:5px 10px 5px 5px;border-radius:12px;display:flex;align-items:center;gap:6px;box-shadow:0 2px 8px #0002}
.menu{position:absolute;top:55px;left:10px;background:#fff;padding:8px;border-radius:12px;box-shadow:0 5px 15px #0003;width:180px;z-index:99}
.hide{display:none}
.card{background:#fff;border-radius:16px;padding:14px;margin-top:10px;box-shadow:0 2px 10px #0001}
.btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:bold;color:#fff}
input{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin-bottom:8px}
</style>
</head>
<body>
<div class="box">
<div class="banner">
<div class="logo" onclick="m()">
<img src="file_000000006f048211a0068b5f7a862720.jpg" style="width:32px;height:32px;border-radius:8px">
<div><b style="font-size:12px">SFA Classes</b><br><small style="color:green;font-size:10px">Study for all</small></div>
</div>
<img src="sfa_banner.jpg">
<div id="menu" class="menu hide">
<button class="btn" style="background:#1e1b4b" onclick="t()">Teacher Login</button>
<button class="btn" style="background:#22c55e;margin-top:6px" onclick="s()">Student Login</button>
</div>
</div>
<div id="home">
<div class="card"><b>⭐ Students of Week</b><p style="color:#888;font-size:13px;margin-top:6px">Aarav 10th, Priya 9th, Rohan 10th</p></div>
<div class="card"><b>💬 Review</b><div id="rv"></div></div>
</div>
<div id="tlog" class="hide"><div class="card"><h3>Teacher Login</h3><br><input id="a" placeholder="admin"><input id="b" type="password" placeholder="1234"><button class="btn" style="background:#1e1b4b" onclick="lt()">Login</button><button class="btn" style="background:#eee;color:#000;margin-top:6px" onclick="gh()">Back</button></div></div>
<div id="slog" class="hide"><div class="card"><h3>Student Login</h3><br><input placeholder="Roll"><button class="btn" style="background:#22c55e">Login</button><button class="btn" style="background:#eee;color:#000;margin-top:6px" onclick="gh()">Back</button></div></div>
<div id="td" class="hide"><div class="card"><b>Teacher Dashboard</b> <span onclick="gh()" style="float:right;background:#eee;padding:5px 8px;border-radius:6px;font-size:12px">Logout</span></div><div class="card"><b>Add Review</b><br><br><input id="n" placeholder="Name"><input id="c" placeholder="Class"><input id="tx" placeholder="Review"><input id="ph" type="file" accept="image/*"><button class="btn" style="background:#22c55e" onclick="sr()">Save</button></div><div class="card"><div id="pr"></div><button onclick="dr()" style="width:100%;padding:8px;background:#fee2e2;color:red;border:none;border-radius:8px;margin-top:6px">Delete</button></div></div>
</div>
<script>
let R=JSON.parse(localStorage.getItem('r')||'null'),tmp='';
function m(){document.getElementById('menu').classList.toggle('hide')}
function t(){document.getElementById('menu').classList.add('hide');document.getElementById('home').classList.add('hide');document.getElementById('tlog').classList.remove('hide')}
function s(){document.getElementById('menu').classList.add('hide');document.getElementById('home').classList.add('hide');document.getElementById('slog').classList.remove('hide')}
function gh(){document.getElementById('home').classList.remove('hide');document.getElementById('tlog').classList.add('hide');document.getElementById('slog').classList.add('hide');document.getElementById('td').classList.add('hide');document.getElementById('menu').classList.add('hide');vr()}
function lt(){if(document.getElementById('a').value=='admin'&&document.getElementById('b').value=='1234'){document.getElementById('tlog').classList.add('hide');document.getElementById('td').classList.remove('hide');vr()}else alert('admin / 1234')}
function vr(){let x=document.getElementById('rv'),y=document.getElementById('pr');if(!R){x.innerHTML='<small style=color:#aaa>No review</small>';if(y)y.innerHTML='<small style=color:#aaa>No review</small>';return}let h='<div style=display:flex;gap:8px;background:#f8fafc;padding:10px;border-radius:10px;margin-top:8px><img src='+(R.p||'https://i.pravatar.cc/60')+' style=width:45px;height:45px;border-radius:50%><div><b>'+R.n+'</b> <small>'+R.c+'</small><p style=font-size:12px>'+R.t+'</p></div></div>';x.innerHTML=h;if(y)y.innerHTML=h}
document.getElementById('ph').addEventListener('change',function(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=function(ev){tmp=ev.target.result};r.readAsDataURL(f)});
function sr(){let n=document.getElementById('n').value,c=document.getElementById('c').value,t=document.getElementById('tx').value;if(!n||!t){alert('Name Review likho');return}R={n:n,c:c||'SFA',t:t,p:tmp||R?.p||''};localStorage.setItem('r',JSON.stringify(R));alert('Saved');vr()}
function dr(){if(confirm('Delete?')){R=null;localStorage.removeItem('r');vr()}}
vr();
</script>
</body>
</html>

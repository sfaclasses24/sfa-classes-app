<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SFA Classes</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#fffbeb;overflow:hidden}
#logoBtn{position:fixed;top:10px;left:10px;z-index:9999;background:#fff;padding:6px 12px;border-radius:12px;display:flex;gap:6px;align-items:center;border:none;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer}
#sWrap{width:100vw;height:100vh;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.page{min-width:100vw;height:100vh;scroll-snap-align:start;flex-shrink:0;background:#000;display:flex;align-items:center;justify-content:center}
.page img{max-width:100vw;max-height:100vh;width:100%;height:100%;object-fit:contain;display:block;background:#fffbeb}
.dots{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:999}.dot{width:10px;height:10px;background:rgba(255,255,255,.6);border-radius:50%;border:2px solid #fff;cursor:pointer}.dot.active{background:#1e1b4b;width:28px;border-radius:10px}
.reviewBar{position:fixed;bottom:58px;left:10px;right:10px;background:#fff;border-radius:14px;padding:9px 12px;display:flex;gap:10px;align-items:center;z-index:999;box-shadow:0 4px 15px rgba(0,0,0,.2)}
.hide{display:none!important}.btn{width:100%;padding:13px;border:none;border-radius:10px;color:#fff;font-weight:bold;cursor:pointer}
input,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin-bottom:7px;background:#f8fafc}.tab{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabBtn{flex:1;padding:10px;border:none;border-radius:10px;font-weight:700;background:#f1f5f9;cursor:pointer}.tabBtn.on{background:#1e1b4b;color:#fff}.card{background:#fff;border-radius:14px;padding:12px;margin-bottom:8px;border:1px solid #f1f5f9}
</style></head><body>
<button id="logoBtn" onclick="openLogin()"><img src="file_000000006f048211a0068b5f7a862720.jpg" style="width:30px;height:30px;border-radius:6px"><b style="font-size:12px;color:#1e1b4b">SFA Classes</b></button>
<div id="sWrap"><div class="page"><img src="sfa_banner.jpg"></div><div class="page"><img src="https://i.pravatar.cc/800?img=11"></div><div class="page"><img src="https://i.pravatar.cc/800?img=5"></div><div class="page"><img src="https://i.pravatar.cc/800?img=8"></div></div>
<div class="reviewBar"><img src="https://i.pravatar.cc/80?img=32" style="width:38px;height:38px;border-radius:50%"><div style="flex:1"><b id="rvName" style="font-size:12px">Rahul</b><br><small id="rvText" style="font-size:11px">Best coaching!</small></div><small id="rvCount">1/3</small></div>
<div class="dots"><div class="dot active" id="d0"></div><div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div></div>

<div id="tlog" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99999;align-items:center;justify-content:center;padding:12px"><div style="background:#fff;border-radius:18px;padding:14px;width:100%;max-width:380px;max-height:90vh;overflow:auto">
<div class="tab"><button class="tabBtn on" id="btnT" onclick="showTab('T')">Teacher</button><button class="tabBtn" id="btnS" onclick="showTab('S')">Student</button><button class="tabBtn" id="btnA" onclick="showTab('A')">About</button></div>
<div id="boxT"><input id="a" placeholder="admin"><input id="b" type="password" placeholder="1234"><button class="btn" style="background:#1e1b4b" onclick="teacherLogin()">Teacher Login</button></div>
<div id="boxS" class="hide"><input id="sa" placeholder="Student ID"><input id="sb" type="password" placeholder="Password"><button class="btn" style="background:#16a34a" onclick="studentLogin()">Student Login</button></div>
<div id="boxA" class="hide"><div style="background:#fffaf0;border-radius:14px;padding:14px;border:1px solid #fde68a"><b>Nitish Sir - SFA Classes</b><p style="font-size:12px;margin-top:8px">Small Batches, Personal Attention, Tests<br>Founder: Nitish Sir 12+ Years</p><div style="margin-top:12px;display:flex;flex-direction:column;gap:8px"><a href="tel:9910964524" style="background:#1e1b4b;color:#fff;text-decoration:none;padding:12px;border-radius:10px;text-align:center;font-weight:700">📞 Call</a><a href="https://wa.me/919910964524" style="background:#16a34a;color:#fff;text-decoration:none;padding:12px;border-radius:10px;text-align:center;font-weight:700">💬 WhatsApp</a></div></div></div>
<button class="btn" style="background:#eee;color:#000;margin-top:10px" onclick="closeLogin()">Close</button></div></div>

<div id="td" class="hide" style="position:fixed;inset:0;background:#f8fafc;z-index:100000;max-width:430px;margin:auto;overflow:auto"><div style="background:#1e1b4b;color:#fff;padding:12px;display:flex;justify-content:space-between;position:sticky;top:0"><b>Teacher Panel</b><button onclick="document.getElementById('td').classList.add('hide')" style="background:#fff;color:#1e1b4b;border:none;padding:6px 12px;border-radius:8px">X</button></div><div class="tab" style="padding:6px;background:#fff;position:sticky;top:44px"><button class="tabBtn on" id="tabStu" onclick="openTab('Stu')">Students</button><button class="tabBtn" id="tabQuiz" onclick="openTab('Quiz')">Quiz</button><button class="tabBtn" id="tabResult" onclick="openTab('Result')">Results</button></div>
<div id="panelStudents" style="padding:12px"><div class="card"><b>Add Student</b><br><br><input type="file" id="stuPhotoInput" accept="image/*"><input id="stuName" placeholder="Name"><input id="stuId" placeholder="ID"><input id="stuPass" type="password" placeholder="Password"><input id="stuClass" placeholder="Class"><button class="btn" style="background:#16a34a" onclick="addStudent()">Add Student</button><div id="stuList" style="margin-top:12px"></div></div></div>
<div id="panelQuiz" class="hide" style="padding:12px"><div class="card"><b>📝 Quiz</b><br><br><label style="font-size:11px;font-weight:bold">Title</label><input id="quizTitle" placeholder="GK Test"><label style="font-size:11px;font-weight:bold">⏰ Time (Minutes)</label><input id="quizTime" type="number" placeholder="10"><label style="font-size:11px;font-weight:bold">📅 Live Till</label><input id="quizExpiry" type="datetime-local"><div style="background:#fef3c7;padding:10px;border-radius:10px;margin:8px 0"><input id="qText" placeholder="Question"><input id="optA" placeholder="A"><input id="optB" placeholder="B"><input id="optC" placeholder="C"><input id="optD" placeholder="D"><select id="correctAns"><option value="0">Correct A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select><button class="btn" style="background:#d97706" onclick="addQ()">+ Add Q</button></div><div id="qList"></div><button class="btn" style="background:#1e1b4b;margin-top:10px" onclick="saveQuiz()">Save Quiz</button><div id="allQuizList" style="margin-top:12px"></div></div></div>
<div id="panelResult" class="hide" style="padding:12px"><div class="card"><b>Results</b><div id="resultList"></div></div></div></div>

<div id="sdash" class="hide" style="position:fixed;inset:0;background:#f0fdf4;z-index:100002;max-width:430px;margin:auto;overflow:auto"><div style="background:#16a34a;color:#fff;padding:14px;display:flex;justify-content:space-between"><b>Student</b><button onclick="document.getElementById('sdash').classList.add('hide')" style="background:#fff;color:#16a34a;border:none;padding:6px 12px;border-radius:8px">X</button></div><div style="padding:14px"><div class="card" style="text-align:center"><img id="sdPhoto" style="width:80px;height:80px;border-radius:50%"><br><b id="sdName"></b><br><small id="sdId"></small></div><div class="card"><b>Available Quiz</b><div id="studentQuizList"></div></div></div></div>

<div id="quizPage" class="hide" style="position:fixed;inset:0;background:#fff;z-index:200000;overflow:auto;padding:12px"><div style="max-width:430px;margin:auto"><div style="display:flex;justify-content:space-between;background:#1e1b4b;color:#fff;padding:12px;border-radius:12px"><b id="quizPageTitle">Quiz</b><b id="timer" style="background:#ef4444;padding:6px 10px;border-radius:8px">00:00</b></div><div style="background:#fef3c7;border-radius:8px;padding:8px;font-size:11px;margin:10px 0"><span id="tabWarn">Switch 0/3</span><br><video id="cam" autoplay muted playsinline style="width:100%;height:80px;background:#000;border-radius:8px;margin-top:6px"></video></div><div id="quizQArea" class="card"></div><button class="btn" style="background:#16a34a" onclick="nextQ()">Next / Submit</button></div></div>
<div id="quizResultPage" class="hide" style="position:fixed;inset:0;background:#f0fdf4;z-index:200001;padding:14px"><div style="max-width:430px;margin:auto"><div class="card" style="text-align:center"><h1 id="finalScore">0/0</h1><p id="finalMsg"></p><button class="btn" style="background:#1e1b4b" onclick="document.getElementById('quizResultPage').classList.add('hide')">Close</button></div></div></div>

<script>
function openLogin(){document.getElementById('tlog').style.display='flex'; showTab('T');}
function closeLogin(){document.getElementById('tlog').style.display='none';}
function showTab(t){
 document.getElementById('btnT').className=t==='T'?'tabBtn on':'tabBtn';
 document.getElementById('btnS').className=t==='S'?'tabBtn on':'tabBtn';
 document.getElementById('btnA').className=t==='A'?'tabBtn on':'tabBtn';
 document.getElementById('boxT').classList.toggle('hide',t!=='T');
 document.getElementById('boxS').classList.toggle('hide',t!=='S');
 document.getElementById('boxA').classList.toggle('hide',t!=='A');
}
var sWrap=document.getElementById('sWrap');
function goToSlide(i){ if(sWrap) sWrap.scrollTo({left:i*sWrap.clientWidth,behavior:'smooth'}); }
if(sWrap){
 sWrap.addEventListener('scroll',function(){
  var idx=Math.round(sWrap.scrollLeft/sWrap.clientWidth);
  for(var j=0;j<4;j++){var d=document.getElementById('d'+j); if(d) d.className=j===idx?'dot active':'dot';}
 });
 for(let i=0;i<4;i++){var d=document.getElementById('d'+i); if(d) d.onclick=function(){goToSlide(i);}; }
}
var reviews=[{n:'Rahul',t:'Best coaching! ❤️'},{n:'Priya',t:'95% aaya!'},{n:'Aman',t:'Small batches!'}]; var ri=0;
setInterval(function(){ri=(ri+1)%reviews.length;var r=reviews[ri];document.getElementById('rvName').innerText=r.n;document.getElementById('rvText').innerText=r.t;document.getElementById('rvCount').innerText=(ri+1)+'/3';},4000);

function teacherLogin(){var id=document.getElementById('a').value.trim();var p=document.getElementById('b').value.trim();if(id==='admin'&&p==='1234'){closeLogin();document.getElementById('td').classList.remove('hide');loadAll();loadQuizzes();loadResults();}else alert('admin / 1234 likho');}
function studentLogin(){var id=document.getElementById('sa').value.trim();var p=document.getElementById('sb').value.trim();var arr=JSON.parse(localStorage.getItem('sfa_students')||'[]');var f=arr.find(s=>s.id===id&&s.pass===p);if(!f) return alert('Student nahi mila');closeLogin();document.getElementById('sdPhoto').src=f.photo||'https://i.pravatar.cc/80';document.getElementById('sdName').innerText=f.name;document.getElementById('sdId').innerText=f.id;window.currentStudent=f;loadStudentQuizzes();document.getElementById('sdash').classList.remove('hide');}
function openTab(t){document.getElementById('panelStudents').classList.toggle('hide',t!=='Stu');document.getElementById('panelQuiz').classList.toggle('hide',t!=='Quiz');document.getElementById('panelResult').classList.toggle('hide',t!=='Result');document.getElementById('tabStu').className=t==='Stu'?'tabBtn on':'tabBtn';document.getElementById('tabQuiz').className=t==='Quiz'?'tabBtn on':'tabBtn';document.getElementById('tabResult').className=t==='Result'?'tabBtn on':'tabBtn'; if(t==='Result') loadResults();}
var tmpPhoto='',tempQ=[],cQuiz=null,cIdx=0,uAns=[],tLeft=0,tInt=null,tabC=0,camS=null;
document.getElementById('stuPhotoInput').addEventListener('change',function(e){var r=new FileReader();r.onload=function(ev){tmpPhoto=ev.target.result;};r.readAsDataURL(e.target.files[0]);});
function loadAll(){var arr=JSON.parse(localStorage.getItem('sfa_students')||'[]');var h='';for(var i=0;i<arr.length;i++){h+='<div class="card"><b>'+arr[i].name+'</b> ID:'+arr[i].id+'</div>';}document.getElementById('stuList').innerHTML=h||'No students';}
function addStudent(){var n=document.getElementById('stuName').value.trim(),id=document.getElementById('stuId').value.trim(),p=document.getElementById('stuPass').value.trim(),cl=document.getElementById('stuClass').value.trim();if(!n||!id||!p) return alert('Bharo');var arr=JSON.parse(localStorage.getItem('sfa_students')||'[]');arr.push({name:n,id:id,pass:p,class:cl,photo:tmpPhoto||'https://i.pravatar.cc/80'});localStorage.setItem('sfa_students',JSON.stringify(arr));loadAll();}
function addQ(){var q=document.getElementById('qText').value.trim(),a=document.getElementById('optA').value.trim(),b=document.getElementById('optB').value.trim(),c=document.getElementById('optC').value.trim(),d=document.getElementById('optD').value.trim(),co=parseInt(document.getElementById('correctAns').value);if(!q||!a||!b||!c||!d) return alert('Sab bharo');if(tempQ.length>=20) return alert('20 max');tempQ.push({q:q,opts:[a,b,c,d],correct:co});document.getElementById('qText').value='';document.getElementById('optA').value='';document.getElementById('optB').value='';document.getElementById('optC').value='';document.getElementById('optD').value='';renderTemp();}
function renderTemp(){var h='';for(var i=0;i<tempQ.length;i++){h+='<div style="background:#fff;padding:6px;border-radius:6px;margin-bottom:4px;font-size:11px">'+(i+1)+'. '+tempQ[i].q.slice(0,30)+'</div>';}document.getElementById('qList').innerHTML=h+'<small>'+tempQ.length+'/20</small>';}
function saveQuiz(){var title=document.getElementById('quizTitle').value.trim(),time=parseInt(document.getElementById('quizTime').value),exp=document.getElementById('quizExpiry').value;if(!title||!time) return alert('Title+Time');if(!exp) return alert('Date select karo');if(tempQ.length==0) return alert('Q add karo');var qs=JSON.parse(localStorage.getItem('sfa_quizzes')||'[]');qs.push({id:Date.now(),title:title,time:time,expiry:exp,questions:tempQ.slice()});localStorage.setItem('sfa_quizzes',JSON.stringify(qs));tempQ=[];renderTemp();document.getElementById('quizTitle').value='';document.getElementById('quizTime').value='';document.getElementById('quizExpiry').value='';loadQuizzes();alert('Saved till '+exp);}
function loadQuizzes(){var qs=JSON.parse(localStorage.getItem('sfa_quizzes')||'[]'),now=new Date(),h='';for(var i=0;i<qs.length;i++){var ex=new Date(qs[i].expiry),isEx=now>ex;h+='<div class="card" style="border-left:4px solid '+(isEx?'red':'green')+'"><b>'+qs[i].title+'</b> '+qs[i].questions.length+'Q '+qs[i].time+'min<br><small>'+ex.toLocaleString('en-IN')+(isEx?' EXPIRED':'')+'</small><br><button onclick="delQ('+i+')" style="background:#fee;border:none;padding:4px 8px;margin-top:4px">Delete</button></div>';}document.getElementById('allQuizList').innerHTML=h||'No quiz';}
function delQ(i){var q=JSON.parse(localStorage.getItem('sfa_quizzes')||'[]');q.splice(i,1);localStorage.setItem('sfa_quizzes',JSON.stringify(q));loadQuizzes();}
function loadStudentQuizzes(){var qs=JSON.parse(localStorage.getItem('sfa_quizzes')||'[]'),rs=JSON.parse(localStorage.getItem('sfa_results')||'[]'),now=new Date(),h='';for(var i=0;i<qs.length;i++){if(!qs[i].expiry) continue;if(now>new Date(qs[i].expiry)) continue;var done=rs.find(r=>r.quizId===qs[i].id&&r.studentId===window.currentStudent.id);h+='<div class="card"><b>'+qs[i].title+'</b><br><small>'+qs[i].questions.length+'Q '+qs[i].time+'min Till:'+new Date(qs[i].expiry).toLocaleString('en-IN')+'</small><br>'+(done?'<b style="color:green">Score '+done.score+'/'+qs[i].total+'</b>':'<button class="btn" style="background:#1e1b4b;margin-top:6px" onclick="startQuiz('+qs[i].id+')">Start</button>')+'</div>';}document.getElementById('studentQuizList').innerHTML=h||'No active quiz';}
async function startQuiz(id){var qs=JSON.parse(localStorage.getItem('sfa_quizzes')||'[]');cQuiz=qs.find(q=>q.id===id);if(!cQuiz) return;if(new Date()>new Date(cQuiz.expiry)) return alert('Expired');if(!confirm('Camera ON hoga')) return;try{camS=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});document.getElementById('cam').srcObject=camS;}catch(e){return alert('Camera allow karo');}cIdx=0;uAns=new Array(cQuiz.questions.length).fill(null);tabC=0;tLeft=cQuiz.time*60;document.getElementById('quizPageTitle').innerText=cQuiz.title;document.getElementById('quizPage').classList.remove('hide');document.getElementById('sdash').classList.add('hide');document.addEventListener('visibilitychange',hv);stTimer();showQ();}
function hv(){if(document.hidden){tabC++;document.getElementById('tabWarn').innerText='Switch '+tabC+'/3';if(tabC>=3) submitQ('Tab Cheating');}}
function stTimer(){clearInterval(tInt);tInt=setInterval(function(){tLeft--;var m=Math.floor(tLeft/60),s=tLeft%60;document.getElementById('timer').innerText=(m<10?'0'+m:m)+':'+(s<10?'0'+s:s);if(tLeft<=0) submitQ('Time Over');},1000);}
function showQ(){var q=cQuiz.questions[cIdx];var h='<b>Q'+(cIdx+1)+'/'+cQuiz.questions.length+'</b><p style="font-weight:700;margin:10px 0">'+q.q+'</p>';for(var i=0;i<q.opts.length;i++){var sel=uAns[cIdx]===i?'background:#1e1b4b;color:#fff':'';h+='<button onclick="selOpt('+i+')" style="width:100%;text-align:left;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:8px;background:#fff;'+sel+'">'+String.fromCharCode(65+i)+'. '+q.opts[i]+'</button>';}document.getElementById('quizQArea').innerHTML=h;}
function selOpt(i){uAns[cIdx]=i;showQ();}
function nextQ(){if(uAns[cIdx]===null) return alert('Option select karo');if(cIdx<cQuiz.questions.length-1){cIdx++;showQ();}else submitQ('Completed');}
function submitQ(r){clearInterval(tInt);document.removeEventListener('visibilitychange',hv);if(camS) camS.getTracks().forEach(t=>t.stop());var sc=0;for(var i=0;i<cQuiz.questions.length;i++) if(uAns[i]===cQuiz.questions[i].correct) sc++;var res=JSON.parse(localStorage.getItem('sfa_results')||'[]');res.push({quizId:cQuiz.id,quizTitle:cQuiz.title,studentId:window.currentStudent.id,studentName:window.currentStudent.name,score:sc,total:cQuiz.questions.length,reason:r,date:new Date().toLocaleString()});localStorage.setItem('sfa_results',JSON.stringify(res));document.getElementById('quizPage').classList.add('hide');document.getElementById('finalScore').innerText=sc+'/'+cQuiz.questions.length;document.getElementById('finalMsg').innerText=r;document.getElementById('quizResultPage').classList.remove('hide');}
function loadResults(){var r=JSON.parse(localStorage.getItem('sfa_results')||'[]'),h='';for(var i=r.length-1;i>=0;i--) h+='<div class="card" style="font-size:11px"><b>'+r[i].studentName+'</b> '+r[i].quizTitle+' <b>'+r[i].score+'/'+r[i].total+'</b><br><small>'+r[i].reason+' '+r[i].date+'</small></div>';document.getElementById('resultList').innerHTML=h||'No results';}
loadAll();
</script>
</body></html>
